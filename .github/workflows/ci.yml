name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The unit tests import flipfinder.db and flipfinder.analysis.arv, which pull
      # in numpy. They need no lightgbm, no database and no scraped data, so the full
      # requirements file is not installed here.
      - run: python -m pip install --upgrade pip numpy pyyaml

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # A syntax error in a module the tests never import would otherwise reach
      # master unnoticed; there is no linter in this project.
      - name: Every module parses
        run: python -m compileall -q flipfinder run.py scripts

      # Read the command list out of run.py rather than hardcoding it here, so
      # adding a command without describing it fails instead of drifting silently.
      - name: Every command is described in --help
        run: |
          python run.py --help
          python - <<'EOF'
          import subprocess, sys, run
          out = subprocess.run([sys.executable, "run.py", "--help"],
                               capture_output=True, text=True, check=True).stdout
          missing = [name for name in run.COMMANDS if f"  {name} " not in out]
          if missing:
              sys.exit(f"not described in --help: {', '.join(missing)}")
          print(f"all {len(run.COMMANDS)} commands described")
          EOF
