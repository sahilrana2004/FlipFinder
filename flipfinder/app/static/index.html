<script>
  // Runs before first paint: settle the theme (no flash), and start the listings
  // request now so it downloads in parallel with Leaflet instead of after it.
  (() => {
    let t = null;
    try { t = localStorage.getItem("ff_theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  })();
  window.ffListings = fetch("/api/listings").then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)));
  window.ffListings.catch(() => {});
</script>
<style>
/* ---------- tokens ---------- */
:root {
  color-scheme: dark;
  --font: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", ui-monospace, Consolas, monospace;

  --bg: #0a0c10;
  --map-bg: #333333;
  --ink: #eef2f7;
  --ink-2: #a7b0bd;
  --ink-3: #7d8796;
  --line: rgba(255, 255, 255, .08);
  --line-2: rgba(255, 255, 255, .14);
  --wash: rgba(255, 255, 255, .045);
  --wash-2: rgba(255, 255, 255, .085);
  --field: rgba(255, 255, 255, .06);
  --accent: #7cc4ff;
  --seq: #3987e5;

  /* Verdicts are status colors: validated for colorblind separation (protan/deutan
     dE 12.2 all-pairs) and >= 3:1 on the dark surface; pins also differ in size. */
  --deal: #54c398;
  --maybe: #f09c17;
  --pass: #c95368;
  --none: #7d8796;
  --ring: #0a0c10;
  --cost-1: #7d8796;
  --cost-2: #5b6573;
  --cost-3: #434b57;

  --glass: rgba(17, 20, 27, .62);
  --glass-strong: rgba(14, 16, 22, .82);
  --glass-solid: #14171d;
  --blur: 22px;
  --sat: 170%;
  --rim: rgba(255, 255, 255, .22);
  --rim-soft: rgba(255, 255, 255, .05);
  --bevel-hi: rgba(255, 255, 255, .075);
  --bevel-lo: rgba(0, 0, 0, .45);
  --spec: rgba(255, 255, 255, .055);
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 20px 50px -20px rgba(0, 0, 0, .8);
  --lens: rgba(255, 255, 255, .14);
  --lens-shadow: inset 0 1px 0 rgba(255, 255, 255, .24), inset 0 -1px 0 rgba(0, 0, 0, .3), 0 1px 4px rgba(0, 0, 0, .4);
  --scrim: rgba(8, 10, 14, .82);
  --on-photo: rgba(10, 12, 16, .55);

  --r-panel: 22px;
  --r-card: 16px;
  --gap: 12px;
  --top: 76px;
  --list-w: 380px;
  --detail-w: 440px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.3, 1.28, .5, 1);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e8ecf1;
  --map-bg: #f2f3f0;
  --ink: #101318;
  --ink-2: #4f5866;
  --ink-3: #5f6875;
  --line: rgba(16, 19, 24, .08);
  --line-2: rgba(16, 19, 24, .15);
  --wash: rgba(16, 19, 24, .04);
  --wash-2: rgba(16, 19, 24, .075);
  --field: rgba(16, 19, 24, .05);
  --accent: #1f6fd1;
  --seq: #2a78d6;
  --deal: #19966e;
  --maybe: #c8800d;
  --pass: #b32035;
  --none: #8a93a0;
  --ring: #ffffff;
  --cost-1: #8f98a5;
  --cost-2: #b3bac4;
  --cost-3: #d0d5dc;
  --glass: rgba(255, 255, 255, .64);
  --glass-strong: rgba(255, 255, 255, .86);
  --glass-solid: #f6f7f9;
  --sat: 185%;
  --rim: rgba(255, 255, 255, .95);
  --rim-soft: rgba(255, 255, 255, .4);
  --bevel-hi: rgba(255, 255, 255, .9);
  --bevel-lo: rgba(16, 19, 24, .06);
  --spec: rgba(255, 255, 255, .6);
  --shadow: 0 0 0 1px rgba(16, 19, 24, .07), 0 1px 2px rgba(16, 19, 24, .06), 0 20px 50px -22px rgba(16, 19, 24, .32);
  --lens: #ffffff;
  --lens-shadow: 0 0 0 .5px rgba(16, 19, 24, .1), 0 1px 3px rgba(16, 19, 24, .16), inset 0 1px 0 #fff;
  --scrim: rgba(232, 236, 241, .84);
  --on-photo: rgba(255, 255, 255, .72);
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.45 var(--font); letter-spacing: -.003em;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow: hidden; overscroll-behavior: none;
}
h1, h2, h3, p, dl, dd, figure, ul { margin: 0; }
ul { padding: 0; list-style: none; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: inherit; }
code { font: 12px var(--mono); padding: 1px 5px; border-radius: 6px; background: var(--field); }
kbd {
  display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px;
  font: 600 10.5px/1 var(--font); color: var(--ink-2);
  border-radius: 5px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line), inset 0 -1px 0 var(--line);
}
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: color-mix(in oklab, var(--accent) 35%, transparent); }
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.i.fill { fill: currentColor; stroke: none; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--none)); flex: none; }
.dot.ring { background: transparent; box-shadow: inset 0 0 0 2px var(--ink); }
.v-deal { --c: var(--deal); }
.v-maybe { --c: var(--maybe); }
.v-pass { --c: var(--pass); }
.v-none { --c: var(--none); }

/* ---------- liquid glass ----------
   Three cheap layers instead of a WebGL refraction pass: backdrop blur + saturation
   for the material, a gradient hairline rim lit from the top-left, and an inner bevel.
   All static, so panning the map only re-blurs; nothing re-rasterizes. */
.glass {
  position: relative; isolation: isolate;
  background: radial-gradient(130% 70% at 0% 0%, var(--spec), transparent 55%), var(--glass);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
  backdrop-filter: blur(var(--blur)) saturate(var(--sat));
  box-shadow: var(--shadow);
}
.glass.strong { background: radial-gradient(130% 70% at 0% 0%, var(--spec), transparent 55%), var(--glass-strong); }
.glass::before, .glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3; }
.glass::before {
  padding: 1px;
  background: linear-gradient(150deg, var(--rim), var(--rim-soft) 30%, transparent 52%, var(--rim-soft) 78%, var(--rim));
  -webkit-mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
.glass::after { box-shadow: inset 0 1px 0 var(--bevel-hi), inset 0 -1px 0 var(--bevel-lo); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass, .glass.strong { background: var(--glass-solid); }
}
@media (prefers-reduced-transparency: reduce) {
  .glass, .glass.strong { background: var(--glass-solid); -webkit-backdrop-filter: none; backdrop-filter: none; }
}

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 34px; padding: 0 13px; border: 0; border-radius: 11px;
  background: var(--field); box-shadow: inset 0 0 0 1px var(--line);
  color: var(--ink); font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap;
  transition: background-color .15s, box-shadow .15s, transform .12s var(--ease), opacity .15s;
}
.btn:hover { background: var(--wash-2); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .55; cursor: default; transform: none; }
.btn .i { width: 15px; height: 15px; }
.btn-sm { height: 30px; padding: 0 11px; border-radius: 10px; font-size: 12.5px; }
.btn-primary { background: var(--ink); color: var(--bg); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
.btn-primary:hover { background: color-mix(in oklab, var(--ink) 88%, var(--bg)); }
.icon-btn {
  display: inline-grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 11px;
  background: transparent; color: var(--ink-2); transition: background-color .15s, color .15s, transform .12s var(--ease);
}
.icon-btn:hover { background: var(--wash-2); color: var(--ink); }
.icon-btn:active { transform: scale(.94); }
.icon-btn .i { width: 17px; height: 17px; }
.link-btn { justify-self: start; border: 0; padding: 0; background: none; color: var(--accent); font-size: 12.5px; font-weight: 600; }
.is-busy { position: relative; color: transparent !important; pointer-events: none; }
.is-busy::after {
  content: ""; position: absolute; inset: 0; margin: auto; width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--ink-3); border-top-color: var(--ink); animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(1turn); } }

/* Segmented control whose selection is a sliding glass lens. */
.seg {
  position: relative; isolation: isolate; display: inline-grid; grid-auto-flow: column; align-items: center;
  padding: 3px; border-radius: 999px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line);
}
.seg > :not(.lens) {
  position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 14px; border: 0; border-radius: 999px; background: none;
  color: var(--ink-2); font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap;
  transition: color .2s;
}
.seg > :not(.lens):hover { color: var(--ink); }
.seg > [aria-current="page"], .seg > [aria-checked="true"] { color: var(--ink); }
.seg .lens {
  position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; width: var(--w, 0);
  transform: translateX(var(--x, 0)); border-radius: 999px; background: var(--lens); box-shadow: var(--lens-shadow);
  opacity: 0; transition: transform .42s var(--spring), width .42s var(--spring), opacity .2s;
}
.seg .lens.instant { transition: none; }
.seg-sm > :not(.lens) { height: 28px; padding: 0 11px; font-size: 12.5px; gap: 5px; }
.seg .count { color: var(--ink-3); font-weight: 600; }
.seg [aria-checked="true"] .count { color: var(--ink-2); }

.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px 0 7px; border-radius: 999px;
  font-size: 11.5px; font-weight: 650; white-space: nowrap; color: var(--ink);
  background: color-mix(in oklab, var(--c, var(--none)) 15%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--c, var(--none)) 38%, transparent);
}
.chip > i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--none)); }
.chip.v-none { color: var(--ink-2); }
.chip.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-2); padding: 0 8px; }
.chip.ghost .i { width: 13px; height: 13px; }
.chip.lg { height: 26px; padding: 0 10px 0 9px; font-size: 12.5px; }
.chip.lg > i { width: 8px; height: 8px; }

.warn {
  display: flex; gap: 9px; align-items: flex-start; padding: 10px 12px; border-radius: 12px;
  font-size: 12.5px; line-height: 1.45; color: var(--ink);
  background: color-mix(in oklab, var(--maybe) 11%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--maybe) 36%, transparent);
}
.warn .i { color: var(--maybe); margin-top: 1px; }

.empty { display: grid; justify-items: center; gap: 10px; padding: 48px 24px; text-align: center; }
.empty .e-icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); }
.empty .e-icon .i { width: 20px; height: 20px; }
.empty h3 { font: 600 15px/1.3 var(--font-display); }
.empty p { max-width: 36ch; color: var(--ink-2); font-size: 13px; }
.empty .btn { margin-top: 4px; }

/* ---------- shell ---------- */
body { --li: calc(var(--list-w) + var(--gap)); --ri: 0px; }
body.list-collapsed { --li: 0px; }
body.detail-open { --ri: calc(var(--detail-w) + var(--gap)); }

#map { position: fixed; inset: 0; z-index: 0; background: var(--map-bg); }
#map::after {
  content: ""; position: absolute; inset: 0; z-index: 1000; pointer-events: none;
  background: var(--scrim); opacity: 0; transition: opacity .35s var(--ease);
}
body:not([data-view="map"]) #map::after { opacity: 1; }
#map.map-failed::before {
  content: "Map unavailable. The list still works."; position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%); color: var(--ink-3); font-size: 13px;
}

.topbar {
  position: fixed; z-index: 30; top: var(--gap); left: var(--gap); right: var(--gap); height: 52px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding: 0 8px 0 12px; border-radius: 18px;
}
.tb-start, .tb-end { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tb-end { justify-content: flex-end; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: 4px; text-decoration: none; border-radius: 10px; }
.brand svg { width: 28px; height: 28px; flex: none; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .25)); }
.brand-name { font: 650 15.5px/1 var(--font-display); letter-spacing: -.015em; }
.summary { display: flex; align-items: center; gap: 14px; margin-right: 8px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.summary span { display: inline-flex; align-items: center; gap: 6px; }
.summary b { color: var(--ink); font-weight: 650; }
body:not([data-view="map"]) .map-only { visibility: hidden; }

.map-ui { transition: opacity .25s var(--ease), visibility 0s linear 0s; }
body:not([data-view="map"]) .map-ui { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .2s var(--ease), visibility 0s linear .2s; }

.panel {
  position: fixed; z-index: 10; top: var(--top); bottom: var(--gap);
  display: flex; flex-direction: column; overflow: hidden; border-radius: var(--r-panel);
}

/* ---------- list panel ---------- */
#listPanel { left: var(--gap); width: var(--list-w); transition: transform .34s var(--ease), opacity .25s var(--ease), visibility 0s; }
body.list-collapsed #listPanel { transform: translateX(calc(-100% - 2 * var(--gap))); opacity: 0; visibility: hidden; transition: transform .34s var(--ease), opacity .25s var(--ease), visibility 0s linear .34s; }
.lp-head { display: grid; gap: 10px; padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
.lp-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lp-title h1 { font: 650 17px/1.2 var(--font-display); letter-spacing: -.015em; }
.select { position: relative; display: inline-flex; align-items: center; }
.select select {
  appearance: none; height: 30px; padding: 0 28px 0 11px; border: 0; border-radius: 10px;
  background: var(--field); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.select select:hover { color: var(--ink); }
.select option { background: var(--glass-solid); color: var(--ink); }
.select .i { position: absolute; right: 8px; width: 14px; height: 14px; pointer-events: none; color: var(--ink-3); }
.search {
  display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 11px; border-radius: 12px;
  background: var(--field); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-3); cursor: text;
  transition: box-shadow .15s;
}
.search:focus-within { box-shadow: inset 0 0 0 1px var(--line-2), 0 0 0 3px color-mix(in oklab, var(--accent) 22%, transparent); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--ink); font-size: 13.5px; }
.search input::placeholder { color: var(--ink-3); }
.search input::-webkit-search-cancel-button { display: none; }
.search:focus-within kbd { visibility: hidden; }
#filters { display: grid; grid-template-columns: repeat(3, auto); justify-content: stretch; }

.list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 6px 6px 10px; outline: 0; }
.card {
  display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; padding: 8px; border-radius: var(--r-card);
  cursor: pointer; content-visibility: auto; contain-intrinsic-size: auto 112px;
  transition: background-color .12s;
}
.card:hover, .card.is-hover { background: var(--wash); }
.card.is-selected { background: var(--wash-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.list:focus-visible .card.is-selected { box-shadow: inset 0 0 0 2px var(--accent); }
.thumb {
  position: relative; width: 88px; height: 76px; border-radius: 12px; overflow: hidden;
  background: var(--field); display: grid; place-items: center; color: var(--ink-3);
}
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb .score-bar {
  position: absolute; left: 6px; right: 6px; bottom: 5px; height: 3px; border-radius: 3px; overflow: hidden;
  background: rgba(10, 12, 16, .5);
}
.thumb .score-bar::after { content: ""; position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--s)); background: #fff; border-radius: 3px; }
.c-body { display: grid; align-content: center; gap: 3px; min-width: 0; }
.c-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.c-addr { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; font-weight: 650; }
.c-sub { color: var(--ink-2); font-size: 12px; }
/* The offer is the headline: what the house is worth paying, with the ask it has to
   come down from beside it. The ask lives here and nowhere else on the card. */
.c-offer { display: flex; align-items: baseline; flex-wrap: wrap; gap: 1px 8px; margin-top: 2px; }
.c-offer b { font-size: 14.5px; font-weight: 700; white-space: nowrap; }
.c-offer .c-ask { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.c-offer.none b { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.c-meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-foot { margin-top: 3px; }
.c-chips { display: flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; }
.flag { display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 6px; border-radius: 999px; font-size: 11.5px; font-weight: 650; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.flag .i { width: 12px; height: 12px; color: var(--pass); }
.flag.conflict { padding: 0 5px; }
.flag.conflict .i { color: var(--maybe); }
.c-margin { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 650; white-space: nowrap; }
.c-margin .i { width: 9px; height: 9px; }
.c-margin.up .i { color: var(--deal); }
.c-margin.down .i { color: var(--pass); }
.list-end { height: 1px; }
.card.skel { pointer-events: none; }
.card.skel .c-body i { display: block; height: 10px; border-radius: 5px; background: var(--field); }
.card.skel .c-body i:nth-child(1) { width: 70%; }
.card.skel .c-body i:nth-child(2) { width: 45%; margin-top: 6px; }
.card.skel .c-body i:nth-child(3) { width: 30%; margin-top: 6px; }
.skel .thumb, .card.skel .c-body i { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

/* ---------- detail panel ---------- */
#detail {
  right: var(--gap); width: var(--detail-w);
  transition: transform .34s var(--ease), opacity .24s var(--ease), visibility 0s linear .34s;
  transform: translateX(28px); opacity: 0; visibility: hidden;
}
body.detail-open #detail { transform: none; opacity: 1; visibility: visible; transition: transform .38s var(--spring), opacity .22s var(--ease), visibility 0s; }
body:not([data-view="map"]) #detail { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .2s var(--ease), visibility 0s linear .2s; }
#detail.is-loading .d-scroll { opacity: .55; transition: opacity .15s .1s; }
.d-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px; }
.d-media { position: relative; }
.d-close { position: absolute; top: 10px; right: 10px; z-index: 4; background: var(--on-photo); color: var(--ink); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.d-close:hover { background: var(--glass-strong); }
.d-body { display: grid; gap: 20px; padding: 16px 8px 8px; }
.d-head { display: grid; gap: 6px; justify-items: start; }
.d-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.d-chips:empty { display: none; }
.d-addr { font: 650 22px/1.2 var(--font-display); letter-spacing: -.02em; }
.d-sub { color: var(--ink-2); font-size: 13px; }
.d-head .btn { margin-top: 6px; }

.gallery { position: relative; overflow: hidden; border-radius: 16px; background: var(--field); aspect-ratio: 3 / 2; }
.g-track { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; outline: 0; }
.g-track::-webkit-scrollbar { display: none; }
.g-track img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: center; scroll-snap-stop: always; user-select: none; cursor: zoom-in; }
.g-empty { display: grid; place-items: center; align-content: center; gap: 6px; color: var(--ink-3); font-size: 12.5px; }
.g-empty .i { width: 22px; height: 22px; }
.g-btn {
  position: absolute; top: 50%; z-index: 2; display: grid; place-items: center; width: 34px; height: 34px; margin-top: -17px;
  border: 0; border-radius: 50%; color: var(--ink); background: var(--on-photo);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  opacity: 0; transition: opacity .18s, transform .12s var(--ease);
}
.g-btn.prev { left: 10px; }
.g-btn.next { right: 10px; }
.g-btn:active { transform: scale(.92); }
.gallery:hover .g-btn, .g-btn:focus-visible { opacity: 1; }
.g-count {
  position: absolute; left: 10px; bottom: 10px; z-index: 2; display: inline-flex; align-items: center; gap: 5px;
  height: 26px; padding: 0 9px; border: 0; border-radius: 999px; background: var(--on-photo); color: var(--ink);
  font-size: 12px; font-weight: 650; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.g-count .i { width: 13px; height: 13px; }

.sec { display: grid; gap: 10px; }
.sec-title { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.sec-title .i { width: 14px; height: 14px; }
.sec-title .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
.sec-note { font-size: 12px; color: var(--ink-3); }
.sec-note b { color: var(--ink-2); font-weight: 650; }
.empty-note { font-size: 12.5px; color: var(--ink-3); }

.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; overflow: hidden; border-radius: 14px; background: var(--line); box-shadow: inset 0 0 0 1px var(--line); }
.facts > div { padding: 9px 12px; background: var(--glass-solid); }
.facts dt { font-size: 11.5px; color: var(--ink-3); }
.facts dd { font-size: 14px; font-weight: 650; margin-top: 1px; }

/* deal math */
.figs { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; }
.fig-label { font-size: 12px; color: var(--ink-2); }
.fig-val { font: 650 22px/1.1 var(--font-display); letter-spacing: -.02em; margin-top: 2px; }
.fig.hero { flex: 1 1 100%; }
.fig.hero .fig-val { font-size: 40px; letter-spacing: -.035em; line-height: 1; margin-top: 4px; }
.fig-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
.stack { position: relative; display: flex; gap: 2px; height: 12px; margin-top: 2px; }
.stack > i { flex: 1 1 0; min-width: 2px; background: var(--c); }
.stack > i:first-child { border-radius: 4px 0 0 4px; }
.stack > i:last-of-type { border-radius: 0 4px 4px 0; }
.stack > i.gain { background: var(--deal); }
.stack .loss { position: absolute; top: -3px; bottom: -3px; right: 0; border-left: 2px solid var(--pass); background: color-mix(in oklab, var(--pass) 28%, transparent); border-radius: 0 5px 5px 0; }
.legend2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; }
.legend2 > div { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 12.5px; }
.legend2 dt { display: flex; align-items: center; gap: 7px; color: var(--ink-2); white-space: nowrap; }
.legend2 dt i { width: 10px; height: 4px; border-radius: 2px; background: var(--c); transform: translateY(-2px); }
.legend2 dd { font-weight: 650; white-space: nowrap; }

.meters { display: grid; gap: 8px; }
.meter { display: grid; grid-template-columns: 82px 1fr 38px; align-items: center; gap: 10px; font-size: 12.5px; }
.m-label { color: var(--ink-2); }
.m-track { position: relative; height: 6px; border-radius: 3px; background: color-mix(in oklab, var(--seq) 18%, transparent); overflow: hidden; }
.m-track i { position: absolute; inset: 0 auto 0 0; width: calc(var(--v) * 100%); border-radius: 0 3px 3px 0; background: var(--seq); }
.m-val { text-align: right; font-weight: 650; }

/* AI assessment */
.ai-card { display: grid; gap: 12px; padding: 14px; border-radius: 16px; background: var(--wash); box-shadow: inset 0 0 0 1px var(--line); }
.ai-card .sec-title .i { color: var(--accent); }
.ai-verdict { font-size: 13px; line-height: 1.5; color: var(--ink-2); }
.ai-verdict b { color: var(--ink); font-weight: 650; }
.ai-grid { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 9px 14px; font-size: 12.5px; }
.ai-grid > span:nth-child(odd) { color: var(--ink-2); }
.cells { display: inline-flex; align-items: center; gap: 3px; }
.cells i { width: 14px; height: 8px; border-radius: 2px; background: color-mix(in oklab, var(--seq) 18%, transparent); }
.cells i.on { background: var(--seq); }
.cells b { margin-left: 8px; font-weight: 650; }
.scope { display: inline-flex; gap: 3px; padding: 2px; border-radius: 999px; background: var(--field); }
.scope span { padding: 2px 9px; border-radius: 999px; color: var(--ink-3); font-size: 11.5px; font-weight: 600; }
.scope span.on { background: var(--lens); box-shadow: var(--lens-shadow); color: var(--ink); }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.flags .chip { --c: var(--pass); font-weight: 600; }
.flags .chip .i { width: 12px; height: 12px; color: var(--pass); }
.ai-notes { position: relative; padding-left: 12px; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
.ai-notes::before { content: ""; position: absolute; left: 0; top: 2px; bottom: 2px; width: 2px; border-radius: 2px; background: var(--line-2); }
.ai-foot { font-size: 11.5px; color: var(--ink-3); }

.remarks { font-size: 13px; line-height: 1.6; color: var(--ink-2); white-space: pre-line; overflow-wrap: anywhere; }
.remarks.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden; }

/* label widget */
.labeler { display: grid; gap: 12px; }
.lb-cond { display: grid; gap: 6px; }
.lb-cond-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); }
.lb-cond-head b { color: var(--ink-2); font-weight: 600; }
.cond { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; padding: 3px; border-radius: 12px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); }
.cond button { height: 28px; border: 0; border-radius: 9px; background: none; color: var(--ink-2); font-size: 12.5px; font-weight: 600; transition: background-color .15s, color .15s; }
.cond button:hover { background: var(--wash-2); color: var(--ink); }
.cond button[aria-checked="true"] { background: var(--lens); box-shadow: var(--lens-shadow); color: var(--ink); }
.vbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.vbtn {
  position: relative; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 0; border-radius: 13px;
  background: var(--field); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); font-size: 13.5px; font-weight: 650;
  transition: background-color .15s, box-shadow .15s, transform .12s var(--ease);
}
.vbtn > i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.vbtn kbd { margin-left: auto; }
.vbtn:hover { background: color-mix(in oklab, var(--c) 12%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--c) 40%, transparent); }
.vbtn:active { transform: scale(.97); }
.vbtn[aria-pressed="true"] { background: color-mix(in oklab, var(--c) 20%, transparent); box-shadow: inset 0 0 0 1.5px var(--c); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { height: 28px; padding: 0 11px; border: 0; border-radius: 999px; background: none; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-2); font-size: 12px; font-weight: 600; transition: background-color .15s, color .15s, box-shadow .15s; }
.tag:hover { color: var(--ink); background: var(--wash); }
.tag[aria-pressed="true"] { color: var(--ink); background: color-mix(in oklab, var(--accent) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 55%, transparent); }
.labeler.is-saving { pointer-events: none; }
.labeler.is-saving .vbtn:not(.is-busy) { opacity: .5; }

/* ---------- map furniture ---------- */
.map-ctl {
  position: fixed; z-index: 10; right: calc(var(--ri) + var(--gap)); bottom: var(--gap);
  display: grid; gap: 2px; padding: 4px; border-radius: 16px;
  transition: right .34s var(--ease), opacity .25s var(--ease), visibility 0s;
}
.legend {
  position: fixed; z-index: 10; left: calc(var(--li) + var(--gap)); bottom: var(--gap);
  display: flex; align-items: center; gap: 14px; height: 36px; padding: 0 14px; border-radius: 999px;
  font-size: 12px; color: var(--ink-2); white-space: nowrap;
  transition: left .34s var(--ease), opacity .25s var(--ease), visibility 0s;
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .dot.v-pass, .legend .dot.v-none { width: 7px; height: 7px; }
.legend .dot.v-deal { width: 10px; height: 10px; }
.legend .dot.v-maybe { width: 9px; height: 9px; }
body.no-ai .legend .ai-only { display: none; }
/* Leaflet's stylesheet loads after this one, so these overrides are scoped to #map to outrank it. */
#map.leaflet-container { background: var(--map-bg); font: inherit; outline: 0; }
#map .leaflet-bottom.leaflet-right { right: calc(var(--ri) + var(--gap) + 52px); bottom: calc(var(--gap) - 4px); transition: right .34s var(--ease); }
#map .leaflet-control-attribution { margin: 0; padding: 2px 8px; border-radius: 8px; background: none; color: var(--ink-3); font-size: 10.5px; line-height: 1.5; text-shadow: 0 1px 2px var(--map-bg); }
#map .leaflet-control-attribution a { color: var(--ink-2); text-decoration: none; }
body:not([data-view="map"]) #map .leaflet-control-container { visibility: hidden; }

.tip {
  position: fixed; z-index: 15; left: 0; top: 0; min-width: 190px; max-width: 280px; padding: 10px 12px; border-radius: 14px;
  background: var(--glass-strong); box-shadow: var(--shadow); pointer-events: none; will-change: transform;
}
.tip-addr { font-size: 13px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tip-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--ink-2); }
.tip-row b { color: var(--ink); font-weight: 650; }

/* ---------- pages (triage, metrics) float over the dimmed map ---------- */
.page { position: fixed; inset: 0; z-index: 5; overflow-y: auto; overscroll-behavior: contain; padding: calc(var(--top) + 8px) 20px 40px; }
.page-inner { max-width: 1180px; margin: 0 auto; display: grid; gap: 12px; animation: rise .35s var(--ease) both; }
.page-inner.narrow { max-width: 560px; margin-top: 8vh; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.page.is-loading .page-inner { opacity: .6; transition: opacity .15s .12s; }
.page-head { display: grid; gap: 4px; padding: 6px 4px 4px; }
.page-head h1 { font: 650 30px/1.1 var(--font-display); letter-spacing: -.025em; }
.page-head p { color: var(--ink-2); font-size: 13.5px; max-width: 70ch; }

.t-bar { display: flex; align-items: center; gap: 18px; min-height: 52px; padding: 8px 10px 8px 16px; border-radius: 18px; }
.t-progress { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.t-progress b { color: var(--ink); font-weight: 650; }
.t-keys { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.t-keys kbd + kbd { margin-left: -2px; }
.t-keys .sep { width: 1px; height: 14px; margin: 0 6px; background: var(--line-2); }
.switch { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .sw { position: relative; width: 36px; height: 22px; border-radius: 999px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line-2); transition: background-color .2s; }
.switch .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink-2); box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: transform .3s var(--spring), background-color .2s; }
.switch input:checked + .sw { background: color-mix(in oklab, var(--accent) 45%, transparent); }
.switch input:checked + .sw::after { transform: translateX(14px); background: #fff; }
.switch input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch:hover { color: var(--ink); }

.t-card { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 0; border-radius: 26px; }
.t-card.leaving { opacity: 0; transform: translateX(-18px) scale(.99); transition: opacity .18s var(--ease), transform .18s var(--ease); }
.t-media { display: grid; align-content: start; gap: 8px; padding: 12px; position: sticky; top: calc(var(--top) + 8px); }
.t-media .gallery { aspect-ratio: 4 / 3; border-radius: 18px; }
.t-thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.t-thumbs button { padding: 0; border: 0; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; background: var(--field); cursor: zoom-in; }
.t-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s var(--ease), opacity .2s; }
.t-thumbs button:hover img { transform: scale(1.05); opacity: .9; }
.t-body { display: grid; align-content: start; gap: 20px; padding: 22px 22px 22px 10px; }
.t-body .d-addr { font-size: 26px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.kpi { display: grid; align-content: start; gap: 4px; padding: 16px 18px 18px; border-radius: 20px; }
.k-label { font-size: 12.5px; color: var(--ink-2); }
.k-val { font: 650 34px/1.1 var(--font-display); letter-spacing: -.03em; }
.k-val.nil, .s-val.nil { color: var(--ink-3); font-weight: 500; }
.k-sub { font-size: 12px; color: var(--ink-3); }
.stackbar { display: flex; gap: 2px; height: 8px; margin-top: 6px; }
.stackbar i { flex: 1 1 0; background: var(--c); }
.stackbar i:first-child { border-radius: 4px 0 0 4px; }
.stackbar i:last-child { border-radius: 0 4px 4px 0; }
.stackbar i:only-child { border-radius: 4px; }
.mini-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 12px; color: var(--ink-2); }
.mini-legend span { display: inline-flex; align-items: center; gap: 6px; }

.bento { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card-g { display: grid; align-content: start; gap: 16px; padding: 18px 20px 20px; border-radius: 22px; min-width: 0; }
.card-g.wide { grid-column: 1 / -1; }
.cg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.cg-head h2 { font: 650 16px/1.3 var(--font-display); letter-spacing: -.01em; }
.cg-head p { margin-top: 3px; font-size: 12.5px; color: var(--ink-3); max-width: 60ch; }
.bars { display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 90px 1fr 44px; align-items: center; gap: 12px; font-size: 13px; }
.b-label { color: var(--ink-2); }
.b-track { position: relative; height: 12px; }
.b-track::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--line-2); }
.b-track i { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--v) * 100%); min-width: 2px; border-radius: 0 4px 4px 0; background: var(--seq); }
.b-val { text-align: right; font-weight: 650; }
.b-axis { display: grid; grid-template-columns: 90px 1fr 44px; gap: 12px; font-size: 11px; color: var(--ink-3); }
.b-axis span:nth-child(2) { display: flex; justify-content: space-between; }
.fit { display: grid; gap: 8px; padding: 12px 14px; border-radius: 14px; background: var(--wash); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; }
.fit-head { display: flex; align-items: center; gap: 8px; }
.fit-head .i { color: var(--c); }
.fit p { color: var(--ink-2); }
.agree { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat .s-val { font: 650 24px/1.15 var(--font-display); letter-spacing: -.02em; }
.stat .s-label { font-size: 12px; color: var(--ink-2); }
.stat .s-sub { font-size: 11.5px; color: var(--ink-3); }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { text-align: left; font-weight: 600; color: var(--ink-3); padding: 0 10px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: top; }
.tbl td.strong { color: var(--ink); font-weight: 650; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; }
.tbl th.num { text-align: right; }
.matrix { justify-self: start; border-collapse: separate; border-spacing: 3px; font-size: 12.5px; }
.matrix caption { caption-side: bottom; padding-top: 6px; text-align: left; font-size: 11.5px; color: var(--ink-3); }
.matrix th { padding: 4px 8px; font-weight: 600; color: var(--ink-3); text-align: center; }
.matrix th[scope="row"] { text-align: right; }
.matrix td { width: 64px; height: 40px; text-align: center; border-radius: 8px; font-weight: 650; color: var(--ink); background: color-mix(in oklab, var(--seq) var(--t), var(--field)); }
.matrix td.hi { color: #fff; }
.matrix td.diag { box-shadow: inset 0 0 0 1.5px var(--line-2); }
.dlist { display: grid; }
.dlist a { display: grid; grid-template-columns: minmax(0, 1fr) auto 44px; gap: 12px; align-items: center; padding: 9px 8px; margin: 0 -8px; border-radius: 10px; text-decoration: none; font-size: 13px; }
.dlist a:hover { background: var(--wash); }
.dlist li + li a { box-shadow: 0 -1px 0 var(--line); }
.dl-addr { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.dl-score { text-align: right; color: var(--ink-2); }
.badge { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--ink); }
.badge .i { width: 13px; height: 13px; color: var(--c); }

/* ---------- photo viewer ---------- */
.viewer { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 64px 72px; background: rgba(5, 6, 8, .9); animation: fade .2s var(--ease); }
@keyframes fade { from { opacity: 0; } }
.viewer img { max-width: min(100%, 1280px); max-height: calc(100dvh - 128px); border-radius: 12px; object-fit: contain; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
.viewer .g-btn { opacity: 1; width: 44px; height: 44px; margin-top: -22px; background: rgba(255, 255, 255, .12); color: #fff; }
.viewer .g-btn.prev { left: 18px; }
.viewer .g-btn.next { right: 18px; }
.viewer .v-close { position: fixed; top: 16px; right: 16px; color: #fff; background: rgba(255, 255, 255, .12); }
.viewer .v-count { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); color: rgba(255, 255, 255, .8); font-size: 13px; font-weight: 600; }

/* ---------- toasts ---------- */
.toasts { position: fixed; z-index: 50; left: 50%; bottom: 20px; transform: translateX(-50%); display: grid; justify-items: center; gap: 8px; pointer-events: none; }
.toast { display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: 999px; font-size: 13px; font-weight: 600; animation: toast-in .32s var(--spring) both; }
.toast .i { width: 15px; height: 15px; color: var(--c, var(--deal)); }
.toast.error { --c: var(--pass); }
.toast.out { opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px) scale(.97); } }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  :root { --list-w: 340px; --detail-w: 400px; }
  .summary { display: none; }
  .legend .you { display: none; }
}
@media (max-width: 980px) {
  .t-card { grid-template-columns: 1fr; }
  .t-media .gallery { position: relative; top: 0; }
  .t-body { padding: 6px 20px 22px; }
  .bento { grid-template-columns: 1fr; }
  .agree { grid-template-columns: repeat(2, minmax(0, 1fr)); }

<!-- In-body stylesheet: the shell above paints without waiting for the CDN; the map
     and the deferred scripts below still get Leaflet's CSS before they run. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<div id="map" aria-label="Map of scored listings"></div>
<script defer src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module">
const Leaflet = window.L;
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

// ---------- formatting & safety ----------
const MINUS = "−";
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
// Addresses, remarks and model output are untrusted text; everything goes through esc().
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ESC[c]);
const fmtInt = v => v == null ? "—" : Math.round(v).toLocaleString("en-US");
const fmtNum = (v, d = 1) => v == null ? "—" : (+v).toLocaleString("en-US", { maximumFractionDigits: d });
const money = v => v == null ? "—" : (v < 0 ? MINUS : "") + "$" + Math.round(Math.abs(v)).toLocaleString("en-US");
const pct = (v, d = 1) => v == null ? "—" : (v < 0 ? MINUS : "") + Math.abs(v * 100).toFixed(d) + "%";
const clamp01 = v => Math.max(0, Math.min(1, +v || 0));
const loc = l => [l.city, l.zip].filter(Boolean).join(" ");
const plural = (n, one, many = one + "s") => `${fmtInt(n)} ${n === 1 ? one : many}`;
const icon = (id, cls = "") => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;

function httpsUrl(u, host) {
  try {
    const x = new URL(u);
    return x.protocol === "https:" && (x.hostname === host || x.hostname.endsWith("." + host)) ? x.href : null;
  } catch { return null; }
}
// Redfin keeps every photo at 623px (mbphoto/genMid.*) and 1280px (bigphoto/*). Either
// stored form maps to both, so an 88px thumbnail never decodes a 1280px original.
const PHOTO = /^(https:\/\/ssl\.cdn-redfin\.com\/photo\/\d+\/)(?:mbphoto\/(\d+)\/genMid\.|bigphoto\/(\d+)\/)([\w-]+\.jpg)$/;
function photo(u) {
  const safe = httpsUrl(u, "cdn-redfin.com");
  if (!safe) return null;
  const m = PHOTO.exec(safe);
  if (!m) return { mid: safe, big: safe, orig: safe };
  const dir = m[2] || m[3];
  return { mid: `${m[1]}mbphoto/${dir}/genMid.${m[4]}`, big: `${m[1]}bigphoto/${dir}/${m[4]}`, orig: safe };
}
// A derived size that doesn't exist falls back to the URL the importer stored.
document.addEventListener("error", e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.dataset.orig || img.currentSrc === img.dataset.orig) return;
  img.removeAttribute("srcset");
  img.src = img.dataset.orig;
}, true);

const VERDICTS = [
  { key: "pass", name: "Pass" },
  { key: "maybe", name: "Maybe" },
  { key: "deal", name: "Deal" },
];
const vKey = v => VERDICTS[v]?.key ?? "none";
const vName = v => VERDICTS[v]?.name ?? "Not labeled";
const TAGS = ["bad area", "reno too deep", "overpriced", "good bones", "wrong size", "weird layout", "bad comps", "flood/structural"];

// Storage can be unavailable (private windows, blocked site data); settings just reset.
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const narrow = matchMedia("(max-width: 760px)");

async function api(path, init) {
  const res = await fetch(path, init);
  if (!res.ok) {
    let detail = `HTTP ${res.status}`;
    try { const body = await res.json(); if (typeof body.detail === "string") detail = body.detail; } catch {}
    throw new Error(detail);
  }
  return res.json();
}

// ---------- state ----------
const FILTERS = {
  all: () => true,
  maybedeal: r => r.ai_verdict >= 1,
  deal: r => r.ai_verdict === 2,
};
const SORTS = {
  score: (a, b) => (b.score ?? -1) - (a.score ?? -1),
  // Ascending: the smallest gap between the ask and what the house is worth paying
  // is the closest thing to a deal. No offer means nothing to be close to, so last.
  offer: (a, b) => (a.offer_discount ?? Infinity) - (b.offer_discount ?? Infinity),
  margin: (a, b) => (b.margin ?? -1e9) - (a.margin ?? -1e9),
  spread: (a, b) => (b.spread ?? -1e12) - (a.spread ?? -1e12),
  price: (a, b) => (a.price ?? 1e12) - (b.price ?? 1e12),
  newest: (a, b) => (a.dom ?? 1e9) - (b.dom ?? 1e9),
};
const S = {
  rows: [],
  byId: new Map(),
  shown: [],
  hasAI: false,
  filter: FILTERS[store.get("ff_map_filter")] ? store.get("ff_map_filter") : "all",
  sort: SORTS[store.get("ff_sort")] ? store.get("ff_sort") : "score",
  query: "",
  selected: null,
  hover: null,
  blind: store.get("ff_blind") === "1",
  view: null,
};

const listPanel = $("#listPanel");
const listEl = $("#list");
const detailEl = $("#detail");
const triageEl = $("#view-triage");
const metricsEl = $("#view-metrics");

// ---------- small UI pieces ----------
function syncLens(seg, animate = true) {
  const lens = seg.querySelector(".lens");
  const on = seg.querySelector('[aria-current="page"], [aria-checked="true"]');
  if (!lens || !on || !on.offsetWidth) return;
  lens.classList.toggle("instant", !animate);
  lens.style.cssText = `--x:${on.offsetLeft}px;--w:${on.offsetWidth}px;opacity:1`;
  if (!animate) requestAnimationFrame(() => lens.classList.remove("instant"));
}

function toast(msg, kind = "ok") {
  const el = document.createElement("div");
  el.className = `toast glass strong ${kind}`;
  el.innerHTML = icon(kind === "error" ? "alert" : "check");
  el.append(msg);
  const host = $("#toasts");
  host.append(el);
  while (host.children.length > 3) host.firstElementChild.remove();
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 220); }, kind === "error" ? 5000 : 2200);
}

const emptyHTML = (ico, title, body, action = "") =>
  `<div class="empty"><div class="e-icon">${icon(ico)}</div><h3>${title}</h3><p>${body}</p>${action}</div>`;
const warnHTML = text => `<div class="warn" role="note">${icon("alert")}<span>${text}</span></div>`;

// ---------- theme ----------
const pal = {};
function readPalette() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ["deal", "maybe", "pass", "none", "ink", "ring"]) pal[k] = cs.getPropertyValue("--" + k).trim();
}
const theme = () => document.documentElement.dataset.theme;
const themeBtn = $("#themeToggle");
function applyTheme(t, persist) {
  document.documentElement.dataset.theme = t;
  if (persist) store.set("ff_theme", t);
  const next = t === "dark" ? "light" : "dark";
  themeBtn.innerHTML = icon(t === "dark" ? "sun" : "moon");
  themeBtn.setAttribute("aria-label", `Switch to ${next} theme`);
  themeBtn.title = `Switch to ${next} theme`;
  readPalette();
  if (tiles) tiles.setUrl(tileUrl());
  restyleMarkers();
}
themeBtn.addEventListener("click", () => applyTheme(theme() === "dark" ? "light" : "dark", true));
// Follow the OS until the user picks a theme explicitly.
matchMedia("(prefers-color-scheme: light)").addEventListener("change", e => {
  if (!store.get("ff_theme")) applyTheme(e.matches ? "light" : "dark", false);
});

// ---------- map ----------
let map = null;
let tiles = null;
let pins = null;
const markers = new Map();
// Stadia serves pages on localhost / 127.0.0.1 without an API key (rate limited), which is
// exactly how this app runs. Its keyless-request check needs the default Referer.
const tileUrl = () => `https://tiles.stadiamaps.com/tiles/${theme() === "light" ? "alidade_smooth" : "alidade_smooth_dark"}/{z}/{x}/{y}{r}.png`;

function initMap() {
  if (!Leaflet) { $("#map").classList.add("map-failed"); return; }
  map = Leaflet.map("map", {
    // One canvas for every pin instead of an SVG node per pin.
    preferCanvas: true,
    renderer: Leaflet.canvas({ padding: 0.3, tolerance: 8 }),
    zoomControl: false,
    zoomSnap: 0.5,
    zoomDelta: 0.5,
    wheelPxPerZoomLevel: 110,
    fadeAnimation: !reduceMotion,
    zoomAnimation: !reduceMotion,
    minZoom: 4,
    maxZoom: 18,
  }).setView([32.79, -96.8], 10);
  map.attributionControl.setPrefix(false);
  tiles = Leaflet.tileLayer(tileUrl(), {
    maxZoom: 20,
    // A 512px tile decodes to ~1MB, so retina tiles are worth ~35MB of image memory
    // on a 1.5x display for labels that are barely sharper: take them only at 2x.
    // Overriding r beats Leaflet's own devicePixelRatio > 1 test.
    r: devicePixelRatio >= 2 ? "@2x" : "",
    // One ring of off-screen tiles instead of two, and no intermediate zoom levels.
    keepBuffer: 1,
    updateWhenZooming: false,
    attribution: '&copy; <a href="https://stadiamaps.com/" target="_blank" rel="noopener noreferrer">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank" rel="noopener noreferrer">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>',
  }).addTo(map);
  pins = Leaflet.featureGroup().addTo(map);
  pins.on("mouseover", e => { const id = e.layer.options.fid; setHover(id); showTip(id, e.containerPoint); });
  pins.on("mouseout", e => { if (S.hover === e.layer.options.fid) setHover(null); hideTip(); });
  pins.on("click", e => go(`#/map/${e.layer.options.fid}`));
  map.on("movestart", hideTip);
  map.on("click", () => { if (S.selected != null) go("#/map"); });
}

function markerStyle(r) {
  const v = r.ai_verdict;
  const sel = r.id === S.selected;
  const hov = r.id === S.hover;
  // Size repeats the verdict so pins stay readable without color.
  const base = v === 2 ? 7.5 : v === 1 ? 6.5 : 5;
  return {
    radius: base + (sel ? 3 : hov ? 2 : 0),
    fillColor: pal[vKey(v)],
    fillOpacity: v == null ? 0.75 : 1,
    color: sel || hov || r.labeled ? pal.ink : pal.ring,
    weight: sel ? 3 : hov || r.labeled ? 2 : 1.5,
    opacity: 1,
  };
}

function syncMarkers() {
  if (!map) return;
  for (const [id, m] of markers) {
    if (!S.byId.has(id)) { pins.removeLayer(m); markers.delete(id); }
  }
  const visible = new Set(S.shown.map(r => r.id));
  pins.clearLayers();
  // Draw order puts deals on top of maybes on top of passes where pins overlap.
  const ordered = S.rows.filter(r => visible.has(r.id) && r.lat != null && r.lng != null)
    .sort((a, b) => (a.ai_verdict ?? -1) - (b.ai_verdict ?? -1));
  for (const r of ordered) {
    let m = markers.get(r.id);
    if (!m) {
      m = Leaflet.circleMarker([r.lat, r.lng], { ...markerStyle(r), fid: r.id, bubblingMouseEvents: false });
      markers.set(r.id, m);
    } else {
      m.setLatLng([r.lat, r.lng]);
      m.setStyle(markerStyle(r));
    }
    pins.addLayer(m);
  }
}

function restyleMarkers() {
  for (const [id, m] of markers) {
    const r = S.byId.get(id);
    if (r) m.setStyle(markerStyle(r));
  }
}

function restyle(id) {
  const r = S.byId.get(id);
  const m = markers.get(id);
  if (r && m) m.setStyle(markerStyle(r));
}

function insets() {
  const top = $(".topbar").getBoundingClientRect().bottom;
  const gap = 12;
  if (narrow.matches) return { top, left: 0, right: 0, bottom: listPanel.offsetHeight + gap };
  return {
    top,
    left: document.body.classList.contains("list-collapsed") ? 0 : listPanel.offsetWidth + gap,
    right: document.body.classList.contains("detail-open") ? detailEl.offsetWidth + gap : 0,
    bottom: 0,
  };
}

function fitToShown(animate) {
  if (!map) return;
  const pts = S.shown.filter(r => r.lat != null && r.lng != null).map(r => [r.lat, r.lng]);
  if (!pts.length) return;
  const i = insets();
  map.fitBounds(pts, {
    paddingTopLeft: [i.left + 48, i.top + 48],
    paddingBottomRight: [i.right + 48, i.bottom + 56],
    maxZoom: 14,
    animate: animate && !reduceMotion,
  });
}

function revealOnMap(r) {
  if (!map || r.lat == null || r.lng == null) return;
  const i = insets();
  map.panInside([r.lat, r.lng], {
    paddingTopLeft: [i.left + 56, i.top + 56],
    paddingBottomRight: [i.right + 56, i.bottom + 64],
    animate: !reduceMotion,
  });
}

const tip = $("#tip");
const tipEls = {
  addr: $(".tip-addr", tip), price: $(".tip-price", tip), margin: $(".tip-margin", tip),
  chip: $(".tip-chip", tip), chipText: $(".tip-chip span", tip), score: $(".tip-score", tip),
};
function showTip(id, pt) {
  const r = S.byId.get(id);
  if (!r) return;
  // textContent only: tooltip labels come straight from listing data.
  tipEls.addr.textContent = r.address ?? "";
  tipEls.price.textContent = money(r.price);
  tipEls.margin.textContent = r.margin == null ? "" : `${pct(r.margin)} margin`;
  tipEls.chip.hidden = !S.hasAI;
  tipEls.chip.className = `chip tip-chip v-${vKey(r.ai_verdict)}`;
  tipEls.chipText.textContent = vName(r.ai_verdict);
  tipEls.score.textContent = r.score == null ? "" : `score ${(+r.score).toFixed(2)}`;
  tip.hidden = false;
  const w = tip.offsetWidth;
  const h = tip.offsetHeight;
  const x = pt.x + 18 + w > innerWidth - insets().right ? pt.x - 18 - w : pt.x + 18;
  const y = Math.max(insets().top + 6, pt.y - h - 14);
  tip.style.transform = `translate3d(${Math.round(x)}px, ${Math.round(y)}px, 0)`;
}
function hideTip() { tip.hidden = true; }

// ---------- data ----------
function setRows(rows) {
  S.rows = rows;
  S.byId = new Map(rows.map(r => [r.id, r]));
  S.hasAI = rows.some(r => "ai_verdict" in r);
  for (const r of rows) r._hay = `${r.address ?? ""} ${r.city ?? ""} ${r.zip ?? ""}`.toLowerCase();
  document.body.classList.toggle("no-ai", !S.hasAI);
  $("#filters").hidden = !S.hasAI;
  if (!S.hasAI) S.filter = "all";
  renderSummary();
}

function computeShown() {
  const q = S.query.trim().toLowerCase();
  const keep = FILTERS[S.filter];
  S.shown = S.rows.filter(r => keep(r) && (!q || r._hay.includes(q))).sort(SORTS[S.sort]);
}

function refresh({ fit = false, animate = false } = {}) {
  computeShown();
  renderCounts();
  renderList();
  syncMarkers();
  if (fit) fitToShown(animate);
}

function renderSummary() {
  const n = S.rows.length;
  let deals = 0, maybes = 0;
  for (const r of S.rows) { if (r.ai_verdict === 2) deals++; else if (r.ai_verdict === 1) maybes++; }
  $("#summary").innerHTML = `<span><b class="num">${fmtInt(n)}</b> scored</span>` + (S.hasAI
    ? `<span><i class="dot v-deal"></i><b class="num">${deals}</b> ${deals === 1 ? "deal" : "deals"}</span><span><i class="dot v-maybe"></i><b class="num">${maybes}</b> maybe</span>`
    : "");
}

function renderCounts() {
  const q = S.query.trim().toLowerCase();
  const pool = q ? S.rows.filter(r => r._hay.includes(q)) : S.rows;
  for (const b of $$("#filters [data-f]")) {
    b.querySelector(".count").textContent = pool.filter(FILTERS[b.dataset.f]).length;
    b.setAttribute("aria-checked", b.dataset.f === S.filter);
  }
  syncLens($("#filters"), false);
}

// "Offer up to $88,809" / "34% below the $135,000 ask". A listing with no ARV has
// no offer to make: it says so and shows the ask, rather than a 0 or a dash that
// would read as an offer of nothing.
function offerLine(max_offer, price, discount) {
  if (max_offer == null) return { headline: "No offer — ARV unavailable", aside: `${money(price)} ask`, none: true };
  // A discount at or below zero means the ask already clears the target margin;
  // saying "−4% below the ask" would read as the opposite of what it is.
  const aside = discount > 0
    ? `${pct(discount, 0)} below the ${money(price)} ask`
    : `the ${money(price)} ask already clears it`;
  return { headline: `Offer up to ${money(max_offer)}`, aside, none: false };
}

function cardHTML(r) {
  const p = photo(r.thumb);
  const specs = [r.beds != null && `${fmtNum(r.beds)} bd`, r.baths != null && `${fmtNum(r.baths)} ba`, r.sqft != null && `${fmtInt(r.sqft)} sf`]
    .filter(Boolean).join(" · ");
  const sub = [esc(loc(r)), specs].filter(Boolean).join(" · ");
  const offer = offerLine(r.max_offer, r.price, r.offer_discount);
  const sel = r.id === S.selected;
  return `<div class="card${sel ? " is-selected" : ""}${r.id === S.hover ? " is-hover" : ""}" role="option" id="c${r.id}" data-id="${r.id}" aria-selected="${sel}">
  <div class="thumb">${p ? `<img src="${esc(p.mid)}" data-orig="${esc(p.orig)}" alt="" loading="lazy" decoding="async">` : icon("home")}${r.score == null ? "" : `<span class="score-bar" style="--s:${clamp01(r.score).toFixed(3)}" title="Score ${(+r.score).toFixed(2)}"></span>`}</div>
  <div class="c-body">
    <div class="c-row"><span class="c-addr">${esc(r.address)}</span></div>
    <div class="c-row c-sub"><span class="c-meta">${sub}</span></div>
    <div class="c-offer${offer.none ? " none" : ""}"><b class="num">${offer.headline}</b>${offer.aside ? `<span class="c-ask num">${offer.aside}</span>` : ""}</div>
    <div class="c-row c-foot">
      <span class="c-chips">${S.hasAI ? `<span class="chip v-${vKey(r.ai_verdict)}"><i></i>${vName(r.ai_verdict)}</span>` : ""}${VERDICTS[r.my_verdict] ? `<span class="chip ghost" title="Your label">You: ${VERDICTS[r.my_verdict].name}</span>` : ""}${r.red_flag_count ? `<span class="flag" title="${plural(r.red_flag_count, "red flag")}">${icon("flag")}${r.red_flag_count}</span>` : ""}${r.text_conflict ? `<span class="flag conflict" title="Remarks describe a different condition than the photos">${icon("alert")}</span>` : ""}</span>
      ${r.margin == null ? "" : `<span class="c-margin num ${r.margin >= 0 ? "up" : "down"}" title="Margin after reno, carry and closing">${icon(r.margin >= 0 ? "tri-up" : "tri-down", "fill")}${pct(r.margin)}</span>`}
    </div>
  </div>
</div>`;
}

// The list renders in chunks: a thousand listings would otherwise put tens of
// thousands of nodes in the document for rows nobody has scrolled to yet.
const CHUNK = 120;
let rendered = 0;
const more = new IntersectionObserver(entries => {
  if (entries.some(e => e.isIntersecting)) growList();
}, { root: listEl, rootMargin: "600px" });

function renderList() {
  const n = S.shown.length;
  const total = S.rows.length;
  $("#listTitle").textContent = n === total ? plural(total, "listing") : `${fmtInt(n)} of ${fmtInt(total)}`;
  listEl.removeAttribute("aria-activedescendant");
  more.disconnect();
  rendered = 0;
  if (!total) {
    listEl.innerHTML = emptyHTML("home", "No scored listings yet", "Run <code>py run.py refresh</code> after pulling data from Redfin.");
    return;
  }
  if (!n) {
    listEl.innerHTML = emptyHTML("search", "Nothing matches", S.query.trim() ? "Try a different address, city or ZIP." : "No listings have this verdict right now.",
      `<button class="btn" type="button" data-act="reset">Show all listings</button>`);
    return;
  }
  rendered = Math.min(CHUNK, n);
  listEl.innerHTML = S.shown.slice(0, rendered).map(cardHTML).join("") + `<div class="list-end" aria-hidden="true"></div>`;
  if (rendered < n) more.observe(listEl.querySelector(".list-end"));
  if (S.selected != null && document.getElementById("c" + S.selected)) listEl.setAttribute("aria-activedescendant", "c" + S.selected);
}

function growList(upTo = rendered + CHUNK) {
  const end = listEl.querySelector(".list-end");
  if (!end || rendered >= S.shown.length) return;
  const next = S.shown.slice(rendered, Math.max(upTo, rendered + CHUNK));
  rendered += next.length;
  end.insertAdjacentHTML("beforebegin", next.map(cardHTML).join(""));
  if (rendered >= S.shown.length) { more.disconnect(); end.remove(); }
}

function patchCard(id) {
  const card = document.getElementById("c" + id);
  const r = S.byId.get(id);
  if (card && r) card.outerHTML = cardHTML(r);
}

function setHover(id) {
  if (S.hover === id) return;
  const prev = S.hover;
  S.hover = id;
  for (const x of [prev, id]) {
    if (x == null) continue;
    restyle(x);
    document.getElementById("c" + x)?.classList.toggle("is-hover", x === id);
  }
  if (id != null) markers.get(id)?.bringToFront();
}

function markSelected(prev, id) {
  for (const x of [prev, id]) {
    if (x == null) continue;
    const card = document.getElementById("c" + x);
    if (card) { card.classList.toggle("is-selected", x === id); card.setAttribute("aria-selected", x === id); }
    restyle(x);
  }
  if (id == null) { listEl.removeAttribute("aria-activedescendant"); return; }
  markers.get(id)?.bringToFront();
  const card = document.getElementById("c" + id);
  if (card) {
    listEl.setAttribute("aria-activedescendant", card.id);
    card.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
  }
}

function step(delta) {
  if (!S.shown.length) return;
  const i = S.shown.findIndex(r => r.id === S.selected);
  const j = i < 0 ? (delta > 0 ? 0 : S.shown.length - 1) : Math.max(0, Math.min(S.shown.length - 1, i + delta));
  if (j >= rendered) growList(j + 1);
  go(`#/map/${S.shown[j].id}`, true);
}

function resetFilters() {
  S.query = "";
  $("#search").value = "";
  S.filter = "all";
  store.set("ff_map_filter", "all");
  refresh({ fit: true });
}

// ---------- routing ----------
function go(hash, replace = false) {
  if (location.hash === hash) return route();
  if (replace) { history.replaceState(null, "", hash); route(); }
  else location.hash = hash;
}

function route() {
  const m = /^#\/(map|triage|metrics)(?:\/(\d+))?$/.exec(location.hash);
  const view = m ? m[1] : "map";
  setView(view);
  if (view !== "map") return;
  const id = m?.[2] ? +m[2] : null;
  if (id == null) closeDetail();
  else openDetail(id);
}

function setView(v) {
  if (S.view === v) return;
  S.view = v;
  document.body.dataset.view = v;
  for (const a of $$("#nav a")) {
    if (a.dataset.view === v) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  }
  syncLens($("#nav"));
  const onMap = v === "map";
  triageEl.hidden = v !== "triage";
  metricsEl.hidden = v !== "metrics";
  $("#map").inert = !onMap;
  for (const el of $$(".map-ui")) el.inert = !onMap;
  detailEl.inert = !onMap || S.selected == null;
  listPanel.inert = !onMap || document.body.classList.contains("list-collapsed");
  hideTip();
  if (v === "triage" && (!T.item || S.byId.get(T.item.id)?.labeled)) loadTriage();
  if (v === "metrics" && metricsStale) loadMetrics();
  document.title = onMap ? "FlipFinder" : `${v === "triage" ? "Triage" : "Metrics"} · FlipFinder`;
}

// ---------- listing detail ----------
const detailCache = new Map();
function loadListing(id) {
  let p = detailCache.get(id);
  if (p) {
    detailCache.delete(id);
    detailCache.set(id, p);
    return p;
  }
  p = api(`/api/listing/${id}`);
  detailCache.set(id, p);
  p.catch(() => detailCache.delete(id));
  // Small LRU: hover prefetch fills it, and nothing large stays alive for long.
  if (detailCache.size > 24) detailCache.delete(detailCache.keys().next().value);
  return p;
}

let detailFor = null;
let detailClearTimer = 0;
function openDetail(id) {
  const prev = S.selected;
  S.selected = id;
  if (prev !== id) markSelected(prev, id);
  clearTimeout(detailClearTimer);
  document.body.classList.add("detail-open");
  detailEl.inert = S.view !== "map";
  const row = S.byId.get(id);
  if (row) requestAnimationFrame(() => revealOnMap(row));
  if (detailFor !== id) {
    detailEl.classList.add("is-loading");
    if (detailFor == null) detailEl.innerHTML = detailSkeleton();
  }
  loadListing(id).then(l => {
    if (S.selected === id) renderDetail(l);
  }, err => {
    if (S.selected !== id) return;
    detailFor = null;
    detailEl.classList.remove("is-loading");
    detailEl.innerHTML = `<div class="d-scroll"><button class="icon-btn d-close" data-act="close" aria-label="Close details">${icon("x")}</button>${emptyHTML("alert", "Couldn't load this listing", esc(err.message), `<button class="btn" type="button" data-act="retry">Try again</button>`)}</div>`;
  });
}

function closeDetail() {
  if (S.selected == null) return;
  const prev = S.selected;
  S.selected = null;
  markSelected(prev, null);
  document.body.classList.remove("detail-open");
  detailEl.inert = true;
  // Drop the closed panel's DOM (and its decoded photos) once the exit animation is done.
  detailClearTimer = setTimeout(() => { detailEl.replaceChildren(); detailFor = null; }, 400);
}

const detailSkeleton = () => `<div class="d-scroll"><div class="gallery skel"></div><div class="d-body"><div class="card skel" aria-hidden="true" style="grid-template-columns:1fr"><div class="c-body"><i></i><i></i><i></i></div></div></div></div>`;

function renderDetail(l) {
  const keepScroll = detailFor === l.id ? detailEl.querySelector(".d-scroll")?.scrollTop ?? 0 : 0;
  detailFor = l.id;
  const c = l.components || {};
  const showAlgo = !S.blind && c.arv != null;
  detailEl.innerHTML = `<div class="d-scroll">
    <div class="d-media">
      ${galleryHTML(l.photos, l.address, "416px")}
      <button class="icon-btn d-close" type="button" data-act="close" aria-label="Close details (Esc)" title="Close (Esc)">${icon("x")}</button>
    </div>
    <div class="d-body">
      ${headHTML(l)}
      ${showAlgo ? dealHTML(l, c) : ""}
      ${aiHTML(l)}
      <section class="sec"><h3 class="sec-title">Property</h3>${factsHTML(l)}</section>
      ${showAlgo ? signalsHTML(c) : ""}
      ${remarksHTML(l)}
      <section class="sec"><h3 class="sec-title">Your call</h3><div data-slot="label"></div></section>
    </div>
  </div>`;
  detailEl.classList.remove("is-loading");
  mountGallery(detailEl.querySelector(".gallery"), l);
  mountRemarks(detailEl);
  detailEl.querySelector('[data-slot="label"]').append(labelWidget(l, v => onLabelSaved(l.id, v)));
  if (keepScroll) detailEl.querySelector(".d-scroll").scrollTop = keepScroll;
}

detailEl.addEventListener("click", e => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "close") go("#/map");
  else if (act === "retry" && S.selected != null) { detailFor = null; openDetail(S.selected); }
});

// ---------- section builders (shared by the detail panel and triage) ----------
function headHTML(l) {
  const url = httpsUrl(l.url, "redfin.com");
  const ai = l.ai_label ? l.ai_label.suggested_verdict : S.byId.get(l.id)?.ai_verdict;
  const chips = [
    S.hasAI && !S.blind ? `<span class="chip lg v-${vKey(ai)}"><i></i>${ai == null ? "Not labeled" : `AI: ${vName(ai)}`}</span>` : "",
    l.label && VERDICTS[l.label.verdict] ? `<span class="chip lg ghost">You: ${VERDICTS[l.label.verdict].name}</span>` : "",
    S.blind ? `<span class="chip lg ghost">${icon("eye-off")}Blind mode</span>` : "",
  ].join("");
  return `<header class="d-head">
    <div class="d-chips">${chips}</div>
    <h2 class="d-addr">${esc(l.address)}</h2>
    <p class="d-sub">${esc(loc(l))}${l.dom != null ? ` · ${plural(l.dom, "day")} on market` : ""}</p>
    ${url ? `<a class="btn btn-sm" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open on Redfin ${icon("ext")}</a>` : ""}
  </header>`;
}

function dealHTML(l, c) {
  const price = l.price ?? 0;
  const reno = c.reno_cost ?? 0;
  const spread = c.spread ?? 0;
  const carry = c.arv - price - reno - spread;
  const gain = spread >= 0;
  const offer = offerLine(c.max_offer, l.price, c.offer_discount);
  const total = gain ? c.arv : price + reno + carry;
  const grow = v => `flex-grow:${Math.max(v, 0).toFixed(0)}`;
  const lossLeft = gain ? 0 : (c.arv / total) * 100;
  return `<section class="sec">
    <div class="figs">
      <div class="fig hero"><div class="fig-label">Offer up to</div><div class="fig-val num">${offer.none ? "No offer" : money(c.max_offer)}</div><div class="fig-sub">${offer.none ? "ARV unavailable" : offer.aside}</div></div>
      <div class="fig"><div class="fig-label">Margin at ask</div><div class="fig-val num">${pct(c.margin)}</div><div class="fig-sub">after reno, carry &amp; closing</div></div>
      <div class="fig"><div class="fig-label">${gain ? "Spread" : "Shortfall"}</div><div class="fig-val num">${money(spread)}</div><div class="fig-sub">on ARV ${money(c.arv)}</div></div>
      ${l.score == null ? "" : `<div class="fig"><div class="fig-label">Score</div><div class="fig-val num">${(+l.score).toFixed(2)}</div><div class="fig-sub">absolute · 0.50 = target margin</div></div>`}
    </div>
    <div class="stack" role="img" aria-label="After-repair value ${money(c.arv)}: purchase ${money(price)}, renovation ${money(reno)}, carry and closing ${money(carry)}, ${gain ? "spread" : "shortfall"} ${money(spread)}">
      <i style="--c:var(--cost-1);${grow(price)}"></i><i style="--c:var(--cost-2);${grow(reno)}"></i><i style="--c:var(--cost-3);${grow(carry)}"></i>${gain ? `<i class="gain" style="${grow(spread)}"></i>` : `<b class="loss" style="left:${lossLeft.toFixed(2)}%"></b>`}
    </div>
    <dl class="legend2">
      <div><dt><i style="--c:var(--cost-1)"></i>Purchase</dt><dd class="num">${money(price)}</dd></div>
      <div><dt><i style="--c:var(--cost-2)"></i>Reno · ${esc(c.reno_tier ?? "—")}</dt><dd class="num">${money(reno)}</dd></div>
      <div><dt><i style="--c:var(--cost-3)"></i>Carry &amp; closing</dt><dd class="num">${money(carry)}</dd></div>
      <div><dt><i style="--c:${gain ? "var(--deal)" : "var(--pass)"}"></i>${gain ? "Spread" : "Over ARV"}</dt><dd class="num">${money(spread)}</dd></div>
    </dl>
    ${c.above_tract_p90 ? warnHTML("ARV $/sqft is above the 90th percentile of everything sold in this tract. That usually means a comp mismatch; verify before trusting the spread.") : ""}
  </section>`;
}

function meterHTML(label, v, hint) {
  return `<div class="meter" title="${esc(hint)}"><span class="m-label">${label}</span><span class="m-track"><i style="--v:${clamp01(v).toFixed(3)}"></i></span><span class="m-val num">${v == null ? "—" : (+v).toFixed(2)}</span></div>`;
}

function signalsHTML(c) {
  return `<section class="sec">
    <h3 class="sec-title">Comps &amp; signals<span class="aside num">${plural(c.comp_count ?? 0, "sold comp")}</span></h3>
    <div class="meters">
      ${meterHTML("Confidence", c.confidence, "Comp count and $/sqft spread")}
      ${meterHTML("Liquidity", c.liquidity, "Tract sales pace and days on market")}
      ${meterHTML("Distress", c.distress, "Remarks keywords, $/sqft discount, age, photo condition")}
    </div>
    <p class="sec-note num">Comp $/sqft <b>${c.comp_ppsf ? "$" + fmtInt(c.comp_ppsf) : "—"}</b>${c.tract_p90_ppsf ? ` · tract 90th percentile <b>$${fmtInt(c.tract_p90_ppsf)}</b>` : ""}</p>
  </section>`;
}

function aiHTML(l) {
  if (!("ai_label" in l)) return "";
  const title = `<h3 class="sec-title">${icon("spark")}AI assessment`;
  if (S.blind) return `<section class="ai-card">${title}</h3><p class="empty-note">Hidden in blind mode so it can't anchor your call.</p></section>`;
  const a = l.ai_label;
  if (!a) return `<section class="ai-card">${title}</h3><p class="empty-note">Not labeled yet. Listings need photos, then <code>py run.py refresh</code>.</p></section>`;
  const allows = a.margin_ceiling == null ? "" : `Margin allows <b>${vName(a.margin_ceiling)}</b>`;
  const verdict = !allows ? "" : a.downgrade
    ? `${allows} — AI downgraded to <b>${vName(a.suggested_verdict)}</b> because ${a.reasons.map(esc).join("; ")}`
    : allows;
  return `<section class="ai-card">
    ${title}<span class="aside">${esc(a.model)} · ${esc(a.prompt_version)}</span></h3>
    ${verdict ? `<p class="ai-verdict">${verdict}</p>` : ""}
    ${a.text_conflict ? warnHTML("Remarks describe a different condition than the photos show. Check the listing, not just the photos.") : ""}
    <div class="ai-grid">
      <span>Condition</span><span class="cells" role="img" aria-label="Condition ${a.condition} of 10">${Array.from({ length: 10 }, (_, i) => `<i class="${i < a.condition ? "on" : ""}"></i>`).join("")}<b class="num">${a.condition}/10</b></span>
      <span>Reno scope</span><span><span class="scope">${["light", "medium", "gut"].map(s => `<span class="${s === a.reno_scope ? "on" : ""}">${s}</span>`).join("")}</span></span>
      ${a.photos_representative ? "" : `<span>Photos</span><span>May not show the whole house</span>`}
      ${l.condition_source === "human" ? `<span>Your condition</span><span class="num">${fmtInt(l.condition_score)}/10 · used for reno cost</span>` : ""}
    </div>
    ${a.red_flags.length ? `<div class="flags">${a.red_flags.map(f => `<span class="chip">${icon("flag")}${esc(f)}</span>`).join("")}</div>` : ""}
    ${a.notes ? `<p class="ai-notes">${esc(a.notes)}</p>` : ""}
    <p class="ai-foot">Model output, not a fact.</p>
  </section>`;
}

function factsHTML(l) {
  const rows = [
    ["Price", money(l.price)],
    ["$ / sqft", l.ppsf ? "$" + fmtInt(l.ppsf) : "—"],
    ["Sqft", fmtInt(l.sqft)],
    ["Beds", fmtNum(l.beds)],
    ["Baths", fmtNum(l.baths)],
    ["Built", l.year_built ?? "—"],
  ];
  return `<dl class="facts">${rows.map(([k, v]) => `<div><dt>${k}</dt><dd class="num">${esc(v)}</dd></div>`).join("")}</dl>`;
}

function remarksHTML(l) {
  if (!l.remarks) return "";
  return `<section class="sec"><h3 class="sec-title">Listing remarks</h3><p class="remarks clamp">${esc(l.remarks)}</p><button class="link-btn" type="button" data-more hidden>Show more</button></section>`;
}
function mountRemarks(root) {
  const box = root.querySelector(".remarks");
  if (!box) return;
  const btn = box.nextElementSibling;
  requestAnimationFrame(() => { btn.hidden = box.scrollHeight <= box.clientHeight + 2; });
