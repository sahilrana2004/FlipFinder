    const clamped = box.classList.toggle("clamp");
    btn.textContent = clamped ? "Show more" : "Show less";
  });
}

// ---------- gallery & viewer ----------
function galleryHTML(urls, alt, sizes) {
  const ps = (urls || []).map(photo).filter(Boolean);
  if (!ps.length) return `<div class="gallery g-empty">${icon("home")}<span>No photos</span></div>`;
  return `<div class="gallery" data-n="${ps.length}">
    <div class="g-track" tabindex="0" aria-label="Photos of ${esc(alt)}">${ps.map((p, i) =>
      `<img src="${esc(p.mid)}" srcset="${esc(p.mid)} 623w, ${esc(p.big)} 1280w" sizes="${sizes}" data-orig="${esc(p.orig)}" alt="${i ? "" : esc(alt)}" ${i ? 'loading="lazy"' : 'fetchpriority="high"'} decoding="async" draggable="false">`).join("")}</div>
    ${ps.length > 1 ? `<button class="g-btn prev" type="button" data-g="-1" aria-label="Previous photo">${icon("chev-l")}</button><button class="g-btn next" type="button" data-g="1" aria-label="Next photo">${icon("chev-r")}</button>` : ""}
    <button class="g-count num" type="button" data-g="open" aria-label="Open photos full screen">${icon("expand")}<span>1</span>&thinsp;/&thinsp;${ps.length}</button>
  </div>`;
}

// Triage has room for the rest of the roll; condition is judged from the photos.
function thumbsHTML(urls, alt) {
  const ps = (urls || []).map(photo).filter(Boolean).slice(1, 7);
  if (!ps.length) return "";
  return `<div class="t-thumbs">${ps.map((p, i) =>
    `<button type="button" data-shot="${i + 1}" aria-label="Photo ${i + 2} of ${esc(alt)}"><img src="${esc(p.mid)}" data-orig="${esc(p.orig)}" alt="" loading="lazy" decoding="async"></button>`).join("")}</div>`;
}

function mountGallery(g, l) {
  if (!g || g.classList.contains("g-empty")) return;
  const track = g.querySelector(".g-track");
  const counter = g.querySelector(".g-count span");
  const n = +g.dataset.n;
  const index = () => Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
  let raf = 0;
  track.addEventListener("scroll", () => {
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; counter.textContent = index() + 1; });
  }, { passive: true });
  const stepTo = d => {
    const next = (index() + d + n) % n;
    track.scrollTo({ left: next * track.clientWidth, behavior: reduceMotion ? "auto" : "smooth" });
  };
  g.addEventListener("click", e => {
    const b = e.target.closest("[data-g]");
    if (b && b.dataset.g !== "open") return stepTo(+b.dataset.g);
    if (b || e.target.tagName === "IMG") openViewer(l.photos, index(), b || e.target);
  });
  g.step = stepTo;
}

const viewer = $("#viewer");
const viewerImg = $("img", viewer);
const V = { photos: [], i: 0, returnFocus: null };
function openViewer(urls, i, from) {
  V.photos = (urls || []).map(photo).filter(Boolean);
  if (!V.photos.length) return;
  V.returnFocus = from;
  viewer.hidden = false;
  showViewer(i);
  $(".v-close", viewer).focus();
}
function showViewer(i) {
  const n = V.photos.length;
  V.i = (i + n) % n;
  const p = V.photos[V.i];
  viewerImg.dataset.orig = p.orig;
  viewerImg.src = p.big;
  $(".v-count", viewer).textContent = `${V.i + 1} / ${n}`;
  for (const b of $$(".g-btn", viewer)) b.hidden = n < 2;
}
function closeViewer() {
  viewer.hidden = true;
  viewerImg.removeAttribute("src");
  V.returnFocus?.focus?.();
}
viewer.addEventListener("click", e => {
  const b = e.target.closest("[data-v]");
  if (!b) { if (e.target === viewer) closeViewer(); return; }
  if (b.dataset.v === "close") closeViewer();
  else showViewer(V.i + +b.dataset.v);
});

// ---------- labeling ----------
function parseTags(raw) {
  try { const t = JSON.parse(raw ?? "[]"); return Array.isArray(t) ? t : []; } catch { return []; }
}

function labelWidget(l, onSaved) {
  const tags = new Set(parseTags(l.label?.tags));
  // Prefilling with the AI condition in blind mode would leak the suggestion.
  const initialCond = l.label?.condition_human ?? (!S.blind && l.ai_label ? l.ai_label.condition : null);
  let cond = initialCond;
  const el = document.createElement("div");
  el.className = "labeler";
  el.innerHTML = `
    <div class="lb-cond">
      <div class="lb-cond-head"><b>Condition</b><span>1 gutted · 10 move-in ready</span></div>
      <div class="cond" role="radiogroup" aria-label="Condition from 1, gutted, to 10, move-in ready">${Array.from({ length: 10 }, (_, i) =>
        `<button type="button" role="radio" data-cond="${i + 1}" aria-checked="${cond === i + 1}">${i + 1}</button>`).join("")}</div>
    </div>
    <div class="vbtns">${VERDICTS.map((v, i) =>
      `<button type="button" class="vbtn v-${v.key}" data-verdict="${i}" aria-pressed="${l.label?.verdict === i}"><i></i>${v.name}<kbd>${i + 1}</kbd></button>`).join("")}</div>
    <div class="tags">${TAGS.map(t => `<button type="button" class="tag" data-tag="${esc(t)}" aria-pressed="${tags.has(t)}">${esc(t)}</button>`).join("")}</div>`;

  el.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.cond) {
      const n = +b.dataset.cond;
      cond = cond === n ? null : n;
      for (const x of el.querySelectorAll("[data-cond]")) x.setAttribute("aria-checked", +x.dataset.cond === cond);
    } else if (b.dataset.tag) {
      const t = b.dataset.tag;
      tags.has(t) ? tags.delete(t) : tags.add(t);
      b.setAttribute("aria-pressed", tags.has(t));
    } else if (b.dataset.verdict) {
      submit(+b.dataset.verdict);
    }
  });

  async function submit(verdict) {
    if (el.classList.contains("is-saving")) return;
    const btn = el.querySelector(`[data-verdict="${verdict}"]`);
    const body = { listing_id: l.id, verdict, tags: [...tags], blind: S.blind, ai_label_id: l.ai_label ? l.ai_label.id : null };
    if (cond !== initialCond && cond !== null) body.condition = cond;
    el.classList.add("is-saving");
    btn.classList.add("is-busy");
    try {
      await api("/api/labels", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    } catch (err) {
      el.classList.remove("is-saving");
      btn.classList.remove("is-busy");
      toast(`Couldn't save the label: ${err.message}`, "error");
      return;
    }
    onSaved(verdict);
  }
  el.submit = submit;
  return el;
}

function applyLocalLabel(id, verdict) {
  detailCache.delete(id);
  const r = S.byId.get(id);
  if (r) {
    r.labeled = 1;
    r.my_verdict = verdict;
    restyle(id);
    patchCard(id);
  }
  metricsStale = true;
}

function onLabelSaved(id, verdict) {
  applyLocalLabel(id, verdict);
  toast(`Saved as ${VERDICTS[verdict].name}`);
  if (S.selected === id) openDetail(id);
}

// ---------- triage ----------
const T = { item: null, widget: null, session: 0, loading: false };

async function loadTriage() {
  if (T.loading) return;
  T.loading = true;
  triageEl.classList.add("is-loading");
  try {
    const l = await api("/api/triage/next");
    T.item = l.done ? null : l;
    renderTriage(l);
  } catch (err) {
    T.item = null;
    T.widget = null;
    triageEl.innerHTML = `<div class="page-inner narrow"><div class="glass strong card-g">${emptyHTML("alert", "Couldn't load the next listing", esc(err.message), `<button class="btn" type="button" data-act="retry">Try again</button>`)}</div></div>`;
  } finally {
    T.loading = false;
    triageEl.classList.remove("is-loading");
  }
}

function renderTriage(l) {
  if (l.done) {
    T.widget = null;
    triageEl.innerHTML = `<div class="page-inner narrow"><div class="glass strong card-g">${emptyHTML("check", "Everything is labeled", "Run <code>py run.py refresh</code> after the next Redfin pull for fresh inventory.", `<a class="btn" href="#/map">Back to the map</a>`)}</div></div>`;
    return;
  }
  const c = l.components || {};
  triageEl.innerHTML = `<div class="page-inner">
    <div class="t-bar glass">
      <div class="t-progress"><b class="num">${fmtInt(l.remaining)}</b> unlabeled${T.session ? ` · <b class="num">${T.session}</b> this session` : ""}</div>
      <label class="switch" title="Hide the algorithm score, deal math and AI suggestion while you decide">
        <input type="checkbox" id="blindToggle" ${S.blind ? "checked" : ""}><span class="sw" aria-hidden="true"></span>Blind mode
      </label>
      <div class="t-keys" aria-hidden="true"><kbd>1</kbd>Pass <kbd>2</kbd>Maybe <kbd>3</kbd>Deal<span class="sep"></span><kbd>←</kbd><kbd>→</kbd>Photos</div>
    </div>
    <article class="t-card glass strong">
      <div class="t-media">${galleryHTML(l.photos, l.address, "(max-width: 980px) 100vw, 620px")}${thumbsHTML(l.photos, l.address)}</div>
      <div class="t-body">
        ${headHTML(l)}
        ${factsHTML(l)}
        ${!S.blind && c.arv != null ? dealHTML(l, c) : ""}
        ${aiHTML(l)}
        ${remarksHTML(l)}
        <section class="sec"><h3 class="sec-title">Your call</h3><div data-slot="label"></div></section>
      </div>
    </article>
  </div>`;
  mountGallery(triageEl.querySelector(".gallery"), l);
  mountRemarks(triageEl);
  T.widget = labelWidget(l, v => onTriageSaved(l, v));
  triageEl.querySelector('[data-slot="label"]').append(T.widget);
  triageEl.scrollTop = 0;
}

function onTriageSaved(l, verdict) {
  T.session++;
  applyLocalLabel(l.id, verdict);
  if (S.selected === l.id) openDetail(l.id);
  triageEl.querySelector(".t-card")?.classList.add("leaving");
  setTimeout(loadTriage, reduceMotion ? 0 : 170);
}

triageEl.addEventListener("change", e => {
  if (e.target.id !== "blindToggle") return;
  S.blind = e.target.checked;
  store.set("ff_blind", S.blind ? "1" : "0");
  if (T.item) renderTriage(T.item);
  if (S.selected != null) { detailFor = null; openDetail(S.selected); }
});
triageEl.addEventListener("click", e => {
  if (e.target.closest('[data-act="retry"]')) return loadTriage();
  const shot = e.target.closest("[data-shot]");
  if (shot && T.item) openViewer(T.item.photos, +shot.dataset.shot, shot);
});

// ---------- metrics ----------
let metricsStale = true;
let metricsData = null;
let lastFit = null;

async function loadMetrics() {
  metricsEl.classList.add("is-loading");
  try {
    metricsData = await api("/api/metrics");
    metricsStale = false;
    renderMetrics(metricsData);
  } catch (err) {
    if (metricsData) toast(`Couldn't refresh metrics: ${err.message}`, "error");
    else metricsEl.innerHTML = `<div class="page-inner narrow"><div class="glass strong card-g">${emptyHTML("alert", "Couldn't load metrics", esc(err.message), `<button class="btn" type="button" data-act="retry">Try again</button>`)}</div></div>`;
  } finally {
    metricsEl.classList.remove("is-loading");
  }
}

const kpiHTML = (label, value, sub) => `<section class="kpi glass"><div class="k-label">${label}</div><div class="k-val${value === "—" ? " nil" : ""}">${value}</div>${sub}</section>`;
const rate = v => v == null ? "—" : `${Math.round(v * 100)}%`;
const fixed = (v, d = 2) => v == null ? "—" : (+v).toFixed(d);

function renderMetrics(m) {
  const lb = m.labels;
  const labelsSub = lb.total
    ? `<div class="stackbar" role="img" aria-label="${lb.pass} pass, ${lb.maybe} maybe, ${lb.deal} deal">${[["pass", lb.pass], ["maybe", lb.maybe], ["deal", lb.deal]].filter(([, n]) => n).map(([k, n]) => `<i class="v-${k}" style="flex-grow:${n}"></i>`).join("")}</div>
       <div class="mini-legend"><span><i class="dot v-pass"></i>${lb.pass} pass</span><span><i class="dot v-maybe"></i>${lb.maybe} maybe</span><span><i class="dot v-deal"></i>${lb.deal} deal</span></div>`
    : `<div class="k-sub">Label listings in <a href="#/triage">Triage</a> to train the scorer</div>`;
  metricsEl.innerHTML = `<div class="page-inner">
    <header class="page-head">
      <h1>Metrics</h1>
      <p>How the scorer and the AI line up with your labels. Your labels are the only ground truth; AI suggestions are never trained on.</p>
    </header>
    <div class="kpis">
      ${kpiHTML("Labels", fmtInt(lb.total), labelsSub)}
      ${kpiHTML("Holdout Spearman ρ", fixed(m.holdout_spearman), `<div class="k-sub">Score rank vs. your verdicts on labels the fitter never sees</div>`)}
      ${kpiHTML("Holdout precision@20", rate(m.holdout_p20), `<div class="k-sub">Top 20 by score that you rated Maybe or Deal</div>`)}
      ${kpiHTML("Scorer", m.scorer_version ? `v${m.scorer_version}` : "Default", `<div class="k-sub">${m.scorer_version ? "Promoted fitted weights" : "Config weights, not fitted yet"} · ${plural(m.scored_listings, "scored listing")}</div>`)}
    </div>
    <div class="bento">
      ${weightsHTML(m)}
      ${m.ai_agreement ? agreementHTML(m.ai_agreement) : ""}
      ${disagreeHTML("Algo likes it, you passed", "Score of 0.75 or more, labeled Pass", m.disagreements.algo_likes_you_pass)}
      ${disagreeHTML("You like it, algo is cold", "Score of 0.40 or less, labeled Deal", m.disagreements.you_like_algo_cold)}
      ${versionsHTML(m.recent_versions)}
    </div>
  </div>`;
}

function weightsHTML(m) {
  const max = 3;
  return `<section class="card-g glass">
    <div class="cg-head">
      <div><h2>Score weights</h2><p>Exponents in the multiplicative score. Refit tunes them to your train labels and promotes only if the holdout holds up.</p></div>
      <button class="btn btn-primary" type="button" data-act="fit">${icon("refresh")}Refit</button>
    </div>
    <div class="bars">${Object.entries(m.weights).map(([k, v]) =>
      `<div class="bar-row"><span class="b-label">${esc(k)}</span><span class="b-track"><i style="--v:${clamp01(v / max).toFixed(3)}"></i></span><span class="b-val num">${fixed(v)}</span></div>`).join("")}
      <div class="b-axis" aria-hidden="true"><span></span><span><span>0</span><span>1</span><span>2</span><span>3</span></span><span></span></div>
    </div>
    <div data-slot="fit">${lastFit ? fitHTML(lastFit) : ""}</div>
  </section>`;
}

function fitHTML(out) {
  const ok = out.promoted;
  const keys = out.new_weights ? Object.keys(out.new_weights) : [];
  return `<div class="fit">
    <div class="fit-head badge ${ok ? "v-deal" : "v-maybe"}">${icon(ok ? "check" : "alert")}${ok ? `Promoted v${out.version}` : "Not promoted"}</div>
    <p>${esc(out.note)}</p>
    ${out.train_n != null ? `<p class="sec-note num">train n ${out.train_n} · holdout n ${out.holdout_n} · train ρ ${fixed(out.train_spearman, 3)} · holdout ρ ${fixed(out.holdout_spearman, 3)} · p@20 ${fixed(out.holdout_p20, 3)}</p>` : ""}
    ${keys.length ? `<table class="tbl"><thead><tr><th>Weight</th><th class="num">Before</th><th class="num">After</th></tr></thead><tbody>${keys.map(k =>
      `<tr><td>${esc(k)}</td><td class="num">${fixed(out.old_weights?.[k], 3)}</td><td class="num strong">${fixed(out.new_weights[k], 3)}</td></tr>`).join("")}</tbody></table>` : ""}
  </div>`;
}

function agreementHTML(ai) {
  const max = Math.max(1, ...ai.confusion.flat());
  const stat = (label, value, sub) => `<div class="stat"><div class="s-label">${label}</div><div class="s-val num${value === "—" ? " nil" : ""}">${value}</div><div class="s-sub">${sub}</div></div>`;
  return `<section class="card-g glass">
    <div class="cg-head"><div><h2>AI suggestions vs. your labels</h2><p>Shown and blind are split: high agreement on shown labels alone can just be anchoring.</p></div></div>
    <div class="agree">
      ${stat("Agreement", rate(ai.verdict_agreement), `n = ${ai.n}`)}
      ${stat("Shown", rate(ai.shown.verdict_agreement), `n = ${ai.shown.n}`)}
      ${stat("Blind", rate(ai.blind.verdict_agreement), `n = ${ai.blind.n}`)}
      ${stat("Condition fixes", fmtInt(ai.condition_corrections), ai.condition_mae == null ? "none yet" : `mean |AI − you| ${ai.condition_mae}`)}
    </div>
    <table class="matrix">
      <caption>Rows: AI suggested · columns: your verdict · diagonal: agreement</caption>
      <thead><tr><th></th>${VERDICTS.map(v => `<th scope="col">${v.name}</th>`).join("")}</tr></thead>
      <tbody>${ai.confusion.map((row, i) => `<tr><th scope="row">${VERDICTS[i].name}</th>${row.map((n, j) => {
        const t = n / max;
        return `<td class="num${i === j ? " diag" : ""}${t > 0.6 ? " hi" : ""}" style="--t:${Math.round(t * 85)}%">${n}</td>`;
      }).join("")}</tr>`).join("")}</tbody>
    </table>
  </section>`;
}

function disagreeHTML(title, sub, rows) {
  return `<section class="card-g glass">
    <div class="cg-head"><div><h2>${title}</h2><p>${sub}</p></div></div>
    ${rows.length ? `<ul class="dlist">${rows.map(r =>
      `<li><a href="#/map/${Number(r.listing_id)}"><span class="dl-addr">${esc(r.address)}</span><span class="num">${money(r.price)}</span><span class="num dl-score">${fixed(r.score)}</span></a></li>`).join("")}</ul>`
      : `<p class="empty-note">None yet.</p>`}
  </section>`;
}

function versionsHTML(vs) {
  return `<section class="card-g glass wide">
    <div class="cg-head"><div><h2>Scorer versions</h2><p>Every refit is recorded, promoted or not.</p></div></div>
    ${vs.length ? `<table class="tbl"><thead><tr><th>Version</th><th class="num">Train n</th><th class="num">Holdout ρ</th><th class="num">p@20</th><th>Status</th><th>Note</th></tr></thead><tbody>${vs.map(v =>
      `<tr><td class="strong">v${v.version}</td><td class="num">${fmtInt(v.train_n)}</td><td class="num">${fixed(v.holdout_spearman, 3)}</td><td class="num">${fixed(v.holdout_p20, 3)}</td><td><span class="badge ${v.promoted ? "v-deal" : "v-none"}">${icon(v.promoted ? "check" : "minus")}${v.promoted ? "Promoted" : "Rejected"}</span></td><td>${esc(v.note)}</td></tr>`).join("")}</tbody></table>`
      : `<p class="empty-note">No refits yet. Refit needs at least 20 train labels.</p>`}
  </section>`;
}

metricsEl.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  if (b.dataset.act === "retry") return loadMetrics();
  if (b.dataset.act !== "fit") return;
  b.disabled = true;
  b.classList.add("is-busy");
  try {
    lastFit = await api("/api/fit", { method: "POST" });
    toast(lastFit.promoted ? `Promoted scorer v${lastFit.version}` : "Refit finished, not promoted", lastFit.promoted ? "ok" : "error");
    if (lastFit.promoted) await reloadListings();
    await loadMetrics();
  } catch (err) {
    toast(`Refit failed: ${err.message}`, "error");
    b.disabled = false;
    b.classList.remove("is-busy");
  }
});

async function reloadListings() {
  detailCache.clear();
  setRows(await api("/api/listings"));
  refresh();
  if (S.selected != null) { detailFor = null; openDetail(S.selected); }
}

// ---------- wiring ----------
listEl.addEventListener("click", e => {
  const card = e.target.closest(".card[data-id]");
  if (card) return go(`#/map/${card.dataset.id}`);
  if (e.target.closest('[data-act="reset"]')) resetFilters();

let prefetchTimer = 0;
listEl.addEventListener("pointerover", e => {

  const id = card ? +card.dataset.id : null;
  if (id === S.hover) return;
  setHover(id);

listEl.addEventListener("keydown", e => {

const searchEl = $("#search");
let searchRaf = 0;
searchEl.addEventListener("input", () => {
  cancelAnimationFrame(searchRaf);
  searchRaf = requestAnimationFrame(() => { S.query = searchEl.value; refresh(); });
});
searchEl.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    e.stopPropagation();
    if (searchEl.value) { searchEl.value = ""; S.query = ""; refresh(); }
    else searchEl.blur();
  } else if (e.key === "Enter" && S.shown.length) {
    go(`#/map/${S.shown[0].id}`);
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    listEl.focus();
    step(1);
  }
});

const filtersEl = $("#filters");
function setFilter(f) {
  if (f === S.filter) return;
  S.filter = f;
  store.set("ff_map_filter", f);
  refresh({ fit: true, animate: true });
  syncLens(filtersEl);
}
filtersEl.addEventListener("click", e => {
  const b = e.target.closest("[data-f]");
  if (b) setFilter(b.dataset.f);
});
filtersEl.addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const keys = Object.keys(FILTERS);
  const next = keys[(keys.indexOf(S.filter) + (e.key === "ArrowRight" ? 1 : keys.length - 1)) % keys.length];
  setFilter(next);
  filtersEl.querySelector(`[data-f="${next}"]`).focus();
});

const sortEl = $("#sort");
sortEl.value = S.sort;
sortEl.addEventListener("change", () => {
  S.sort = sortEl.value;
  store.set("ff_sort", S.sort);
  refresh();
  listEl.scrollTop = 0;
});

const listToggle = $("#listToggle");
function setListOpen(open, persist) {
  document.body.classList.toggle("list-collapsed", !open);
  listToggle.setAttribute("aria-pressed", open);
  listToggle.setAttribute("aria-label", open ? "Hide listing panel" : "Show listing panel");
  listPanel.inert = !open || S.view !== "map";
  if (persist) store.set("ff_list", open ? "1" : "0");
}
listToggle.addEventListener("click", () => setListOpen(document.body.classList.contains("list-collapsed"), true));

$(".map-ctl").addEventListener("click", e => {
  const b = e.target.closest("[data-map]");
  if (!b || !map) return;
  if (b.dataset.map === "in") map.zoomIn();
  else if (b.dataset.map === "out") map.zoomOut();
  else fitToShown(true);
});

document.addEventListener("keydown", e => {
  if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!viewer.hidden) {
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowLeft" || e.key === "ArrowRight") showViewer(V.i + (e.key === "ArrowRight" ? 1 : -1));
    return;
  }
  if (e.target.closest("input, select, textarea, [contenteditable]")) return;
  const arrow = e.key === "ArrowLeft" ? -1 : e.key === "ArrowRight" ? 1 : 0;
  if (S.view === "map") {
    if (e.key === "Escape" && S.selected != null) go("#/map");
    else if (e.key === "/") { e.preventDefault(); if (document.body.classList.contains("list-collapsed")) setListOpen(true, true); searchEl.focus(); }
    else if (e.key === "j" || e.key === "k") step(e.key === "j" ? 1 : -1);
    else if (e.key === "l" || e.key === "L") setListOpen(document.body.classList.contains("list-collapsed"), true);
    else if (arrow && S.selected != null && !e.target.closest("#map")) detailEl.querySelector(".gallery")?.step?.(arrow);
  } else if (S.view === "triage" && T.widget) {
    if (e.key === "1" || e.key === "2" || e.key === "3") { e.preventDefault(); T.widget.submit(+e.key - 1); }
    else if (arrow) triageEl.querySelector(".gallery")?.step?.(arrow);
  }
});

let resizeRaf = 0;
addEventListener("resize", () => {
  cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(() => { syncLens($("#nav"), false); syncLens(filtersEl, false); });
});
addEventListener("hashchange", route);

// ---------- boot ----------
readPalette();
applyTheme(theme(), false);
setListOpen(store.get("ff_list") !== "0", false);
initMap();
route();
syncLens($("#nav"), false);
try {
  setRows(await window.ffListings);
  refresh({ fit: true });
  if (S.selected != null) {
    markSelected(null, S.selected);
    const r = S.byId.get(S.selected);
    if (r) revealOnMap(r);
  }
} catch (err) {
  listEl.innerHTML = emptyHTML("alert", "Can't reach the FlipFinder server", `Start it with <code>py run.py serve</code>, then retry. (${esc(err.message)})`,
    `<button class="btn" type="button" data-act="reload">Retry</button>`);
}
</script>
</body>
</html>
