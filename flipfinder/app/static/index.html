<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlipFinder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0f1216; --panel: #171c22; --panel2: #1e252d; --border: #2a333d;
    --text: #dde4ea; --muted: #8a97a3; --green: #3ecf6e; --amber: #e8b23e;
    --red: #e05555; --accent: #4da3ff;
    --v-deal: #3ecf6e; --v-maybe: #e8b23e; --v-pass: #a35a5a; --v-none: #5b6570;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: .3px; }
  nav button { background: none; border: none; color: var(--muted); font: inherit; padding: 6px 12px; cursor: pointer; border-radius: 6px; }
  nav button.on { background: var(--panel2); color: var(--text); }
  #stat { margin-left: auto; color: var(--muted); font-size: 12px; }
  main { flex: 1; position: relative; overflow: hidden; }
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: flex; }

  /* Map */
  #mapcol { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #map { flex: 1; background: #0b0d10; }
  #mapbar { display: flex; align-items: center; gap: 14px; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  #mapbar .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  #mapbar .seg button { background: none; border: none; color: var(--muted); font: inherit; padding: 4px 10px; cursor: pointer; }
  #mapbar .seg button.on { background: var(--panel2); color: var(--text); }
  .legend { display: flex; gap: 12px; margin-left: auto; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .ai .ai-verdict { margin-bottom: 6px; }
  .leaflet-tile { filter: invert(1) hue-rotate(180deg) brightness(0.75) contrast(0.9) saturate(0.4); }
  #panel { width: 380px; background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; display: none; }
  #panel.open { display: block; }
  .addr { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 10px 0; font-size: 13px; }
  .grid b { color: var(--text); font-weight: 600; }
  .grid span { color: var(--muted); }
  .scorebar { height: 8px; border-radius: 4px; background: var(--panel2); margin: 6px 0 14px; overflow: hidden; }
  .scorebar i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--amber), var(--green)); }
  .remarks { font-size: 12.5px; color: var(--muted); background: var(--panel2); border-radius: 8px; padding: 10px; margin: 10px 0; max-height: 130px; overflow-y: auto; }
  .comp { font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
  .comp div { display: flex; justify-content: space-between; padding: 2px 0; }
  .warn { margin-top: 8px; padding: 7px 9px; border-radius: 6px; font-size: 12px;
          color: var(--amber); background: rgba(232,178,62,.10); border: 1px solid var(--amber); }
  a.ext { color: var(--accent); font-size: 12px; text-decoration: none; }
  .ai { margin: 10px 0; padding: 10px; border-radius: 8px; border: 1px dashed var(--border); font-size: 12.5px; }
  .ai .ai-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .ai .ai-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  .ai ul { margin: 4px 0 0 18px; padding: 0; color: var(--muted); }
  .ai .ai-notes { color: var(--muted); margin-top: 6px; font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--red); color: var(--red); }
  .cond { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12.5px; color: var(--muted); }
  .cond select { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; font: inherit; }

  /* Label widget */
  .verdicts { display: flex; gap: 8px; margin: 12px 0 8px; }
  .verdicts button { flex: 1; padding: 10px 0; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
  .verdicts button:hover { border-color: var(--muted); }
  .v-pass.picked { background: #3a2326; border-color: var(--red); }
  .v-maybe.picked { background: #3a3323; border-color: var(--amber); }
  .v-deal.picked { background: #1f3a29; border-color: var(--green); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tags button { font-size: 11.5px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); background: none; color: var(--muted); cursor: pointer; }
  .tags button.picked { border-color: var(--accent); color: var(--accent); }

  /* Triage */
  #triage { flex-direction: column; align-items: center; overflow-y: auto; padding: 24px; }
  .card { width: 560px; max-width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .card img { width: 100%; height: 300px; object-fit: cover; background: var(--panel2); display: block; }
  .card .body { padding: 16px; }
  .tbar { width: 560px; max-width: 100%; display: flex; align-items: center; gap: 12px; margin-bottom: 12px; color: var(--muted); font-size: 12px; }
  .tbar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .keyhint { margin-left: auto; }
  kbd { background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 11px; }

  /* Metrics */
  #metrics { flex-direction: column; overflow-y: auto; padding: 24px; gap: 16px; align-items: flex-start; }
  .tiles { display: flex; gap: 12px; flex-wrap: wrap; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 20px; min-width: 150px; }
  .tile .big { font-size: 26px; font-weight: 700; }
  .tile .lbl { color: var(--muted); font-size: 12px; }
  .box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; width: 100%; max-width: 760px; }
  .box h3 { font-size: 13px; margin-bottom: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .box table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .box td, .box th { padding: 5px 8px; text-align: left; border-bottom: 1px solid var(--border); }
  .box th { color: var(--muted); font-weight: 500; }
  #fitbtn { background: var(--accent); border: none; color: #06121f; font: inherit; font-weight: 600; padding: 9px 18px; border-radius: 8px; cursor: pointer; }
  #fitout { white-space: pre-wrap; font-family: Consolas, monospace; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; width: 100%; }
</style>
</head>
<body>
<header>
  <h1>FlipFinder</h1>
  <nav>
    <button data-v="mapview" class="on">Map</button>
    <button data-v="triage">Triage</button>
    <button data-v="metrics">Metrics</button>
  </nav>
  <span id="stat"></span>
</header>
<main>
  <div id="mapview" class="view on">
    <div id="mapcol">
      <div id="mapbar">
        <span>Show</span>
        <div class="seg">
          <button data-f="all">All</button><button data-f="maybedeal">Maybe + Deal</button><button data-f="deal">Deal only</button>
        </div>
        <div class="legend">
          <span><i style="background:var(--v-deal)"></i>Deal</span>
          <span><i style="background:var(--v-maybe)"></i>Maybe</span>
          <span><i style="background:var(--v-pass)"></i>Pass</span>
          <span><i style="background:var(--v-none)"></i>Not labeled</span>
        </div>
      </div>
      <div id="map"></div>
    </div>
    <div id="panel"></div>
  </div>
  <div id="triage" class="view"></div>
  <div id="metrics" class="view"></div>
</main>
<script>
const TAGS = ["bad area","reno too deep","overpriced","good bones","wrong size","weird layout","bad comps","flood/structural"];
const V_NAMES = ["Pass","Maybe","Deal"];
let blind = localStorage.getItem("ff_blind") === "1";
let map, markers = [], current = null, triageCur = null;

const $ = s => document.querySelector(s);
const fmt$ = v => v == null ? "—" : "$" + Math.round(v).toLocaleString();
const fmt = v => v == null ? "—" : Math.round(v).toLocaleString();
const loc = l => l.city + (l.zip ? " " + l.zip : "");
const pct = v => v == null ? "—" : (v * 100).toFixed(1) + "%";
// Model output echoes listing remarks, so it's escaped before going into innerHTML.
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);

function verdictLine(a) {
  if (a.margin_ceiling == null) return "";
  const allows = `Margin allows <b>${V_NAMES[a.margin_ceiling]}</b>`;
  if (!a.downgrade) return `<div class="ai-verdict">${allows}</div>`;
  return `<div class="ai-verdict">${allows} — AI downgraded to <b>${V_NAMES[a.suggested_verdict]}</b> because ${a.reasons.map(esc).join("; ")}</div>`;
}
function aiBlock(l) {
  const a = l.ai_label;
  if (blind || !a) return "";
  return `<div class="ai">
    <div class="ai-head"><span>AI label — model output, not a fact</span><span>${esc(a.model)} · ${esc(a.prompt_version)}</span></div>
    ${verdictLine(a)}
    ${a.text_conflict ? `<div class="warn" style="margin:0 0 8px">Remarks describe a different condition than the photos show — check the listing, not just the photos.</div>` : ""}
    <div class="ai-row">
      <span>Condition <b>${a.condition}/10</b></span>
      <span>Reno <b>${esc(a.reno_scope)}</b></span>
      ${a.photos_representative ? "" : `<span style="color:var(--amber)">photos may not be representative</span>`}
    </div>
    ${a.red_flags.length ? `<div class="chips">${a.red_flags.map(f => `<span class="chip">${esc(f)}</span>`).join("")}</div>` : ""}
    ${a.notes ? `<div class="ai-notes">${esc(a.notes)}</div>` : ""}
  </div>`;
}

// ---- tabs ----
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("on"));
  document.querySelectorAll(".view").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  $("#" + b.dataset.v).classList.add("on");
  if (b.dataset.v === "triage") loadTriage();
  if (b.dataset.v === "metrics") loadMetrics();
  if (b.dataset.v === "mapview") setTimeout(() => map.invalidateSize(), 50);
});

// ---- map ----
const VERDICT_COLORS = ["var(--v-pass)", "var(--v-maybe)", "var(--v-deal)"];
const FILTERS = { all: () => true, maybedeal: r => r.ai_verdict >= 1, deal: r => r.ai_verdict === 2 };
let mapRows = [];
// Storage can be unavailable (private windows, blocked site data); the filter just resets.
let mapFilter = "all";
try { if (FILTERS[localStorage.getItem("ff_map_filter")]) mapFilter = localStorage.getItem("ff_map_filter"); } catch (e) {}

function cssVar(v) {
  return getComputedStyle(document.documentElement).getPropertyValue(v.slice(4, -1)).trim();
}
function pinColor(r) {
  return cssVar(r.ai_verdict == null ? "var(--v-none)" : VERDICT_COLORS[r.ai_verdict]);
}
function renderMarkers(fit) {
  markers.forEach(m => m.remove());
  markers = [];
  document.querySelectorAll("#mapbar .seg button").forEach(b => b.classList.toggle("on", b.dataset.f === mapFilter));
  const shown = mapRows.filter(FILTERS[mapFilter]);
  $("#stat").textContent = `${shown.length} of ${mapRows.length} scored listings`;
  const bounds = [];
  shown.forEach(r => {
    const m = L.circleMarker([r.lat, r.lng], {
      radius: 7, color: r.labeled ? "#fff" : "transparent", weight: 1.5,
      fillColor: pinColor(r), fillOpacity: 0.9,
    }).addTo(map);
    m.on("click", () => openPanel(r.id));
    const verdict = r.ai_verdict == null ? "not labeled" : "AI " + V_NAMES[r.ai_verdict];
    m.bindTooltip(`${esc(r.address)} — ${fmt$(r.price)} · ${verdict} · score ${r.score.toFixed(2)}`);
    markers.push(m);
    bounds.push([r.lat, r.lng]);
  });
  map.invalidateSize();
  if (fit && bounds.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
}
async function loadMap() {
  mapRows = await (await fetch("/api/listings")).json();
  renderMarkers(true);
}
document.querySelectorAll("#mapbar .seg button").forEach(b => b.onclick = () => {
  mapFilter = b.dataset.f;
  try { localStorage.setItem("ff_map_filter", mapFilter); } catch (e) {}
  renderMarkers(true);
});
function labelWidget(l, onDone) {
  const picked = new Set();
  // Prefilling with the AI condition in blind mode would leak the suggestion.
  const initialCond = l.label?.condition_human ?? (!blind && l.ai_label ? l.ai_label.condition : null);
  const div = document.createElement("div");
  div.innerHTML = `
    <label class="cond">Condition
      <select>
        <option value="">—</option>
        ${Array.from({ length: 10 }, (_, i) => `<option value="${i + 1}" ${initialCond === i + 1 ? "selected" : ""}>${i + 1}</option>`).join("")}
      </select>
      <span>1 gutted · 10 move-in ready</span>
    </label>
    <div class="verdicts">
      ${V_NAMES.map((n, i) => `<button class="v-${n.toLowerCase()}" data-v="${i}">${n} <kbd>${i+1}</kbd></button>`).join("")}
    </div>
    <div class="tags">${TAGS.map(t => `<button data-t="${t}">${t}</button>`).join("")}</div>`;
  div.querySelectorAll(".tags button").forEach(b => b.onclick = () => {
    b.classList.toggle("picked");
    picked.has(b.dataset.t) ? picked.delete(b.dataset.t) : picked.add(b.dataset.t);
  });
  const sel = div.querySelector(".cond select");
  // Blur after picking so the 1/2/3 verdict keys don't also retype the select.
  sel.onchange = () => sel.blur();
  div.querySelectorAll(".verdicts button").forEach(b => b.onclick = async () => {
    const body = { listing_id: l.id, verdict: +b.dataset.v, tags: [...picked], blind,
                   ai_label_id: l.ai_label ? l.ai_label.id : null };
    const cond = sel.value === "" ? null : +sel.value;
    if (cond !== initialCond && cond !== null) body.condition = cond;
    await fetch("/api/labels", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    onDone(+b.dataset.v);
  });
  if (l.label) {
    const b = div.querySelector(`.verdicts button[data-v="${l.label.verdict}"]`);
    if (b) b.classList.add("picked");
  }
  return div;
}
async function openPanel(id) {
  const l = await (await fetch("/api/listing/" + id)).json();
  current = l;
  const c = l.components || {};
  const p = $("#panel");
  p.classList.add("open");
  p.innerHTML = `
    <div class="addr">${l.address}</div>
    <div class="sub">${loc(l)} · <a class="ext" href="${l.url}" target="_blank">Redfin ↗</a></div>
    ${l.photos.length ? `<img src="${l.photos[0]}" style="width:100%;border-radius:8px;margin-bottom:10px">` : ""}
    ${l.score != null && !blind ? `
      <div><b>Score ${l.score.toFixed(2)}</b></div>
      <div class="scorebar"><i style="width:${l.score * 100}%"></i></div>` : ""}
    <div class="grid">
      <span>Price</span><b>${fmt$(l.price)}</b>
      <span>Sqft</span><b>${fmt(l.sqft)}</b>
      <span>Beds / Baths</span><b>${fmt(l.beds)} / ${fmt(l.baths)}</b>
      <span>Year built</span><b>${l.year_built ?? "—"}</b>
      <span>DOM</span><b>${fmt(l.dom)}</b>
      <span>$/sqft</span><b>${l.ppsf ? "$" + l.ppsf.toFixed(0) : "—"}</b>
    </div>
    ${aiBlock(l)}
    ${l.remarks ? `<div class="remarks">${l.remarks}</div>` : ""}
    ${!blind && c.arv ? `<div class="comp">
      <div><span>ARV (${c.comp_count} comps)</span><b>${fmt$(c.arv)}</b></div>
      <div><span>Reno (${c.reno_tier})</span><b>${fmt$(c.reno_cost)}</b></div>
      <div><span>Spread</span><b>${fmt$(c.spread)}</b></div>
      <div><span>Margin</span><b>${pct(c.margin)}</b></div>
      <div><span>Confidence</span><b>${c.confidence.toFixed(2)}</b></div>
      <div><span>Liquidity</span><b>${c.liquidity.toFixed(2)}</b></div>
      <div><span>Distress</span><b>${(c.distress ?? 0).toFixed(2)}</b></div>
    </div>` : ""}
    ${!blind && c.above_tract_p90 ? `<div class="warn">ARV $/sqft is above the 90th percentile of everything sold in this tract — likely a comp mismatch, verify before trusting the spread.</div>` : ""}
    <div id="pw"></div>`;
  p.querySelector("#pw").appendChild(labelWidget(l, () => { openPanel(id); loadMap(); }));
}

// ---- triage ----
async function loadTriage() {
  const t = $("#triage");
  const l = await (await fetch("/api/triage/next")).json();
  if (l.done) { t.innerHTML = `<div class="empty">All scored listings are labeled. Re-run the pipeline for fresh inventory.</div>`; return; }
  triageCur = l;
  const c = l.components || {};
  t.innerHTML = `
    <div class="tbar">
      <span>${l.remaining} unlabeled</span>
      <label><input type="checkbox" id="blindchk" ${blind ? "checked" : ""}> blind mode (hide algo score and AI suggestion)</label>
      <span class="keyhint"><kbd>1</kbd> pass · <kbd>2</kbd> maybe · <kbd>3</kbd> deal</span>
    </div>
    <div class="card">
      ${l.photos.length ? `<img src="${l.photos[0]}">` : ""}
      <div class="body">
        <div class="addr">${l.address}</div>
        <div class="sub">${loc(l)} · <a class="ext" href="${l.url}" target="_blank">Redfin ↗</a></div>
        <div class="grid">
          <span>Price</span><b>${fmt$(l.price)}</b>
          <span>Sqft</span><b>${fmt(l.sqft)}</b>
          <span>Beds / Baths</span><b>${fmt(l.beds)} / ${fmt(l.baths)}</b>
          <span>Year built</span><b>${l.year_built ?? "—"}</b>
          <span>DOM</span><b>${fmt(l.dom)}</b>
          ${!blind ? `<span>Algo score</span><b>${l.score?.toFixed(2) ?? "—"}</b>
                      <span>Margin</span><b>${pct(c.margin)}</b>` : ""}
        </div>
        ${!blind && c.above_tract_p90 ? `<div class="warn">ARV $/sqft is above the 90th percentile for this tract — likely a comp mismatch.</div>` : ""}
        ${aiBlock(l)}
        ${l.remarks ? `<div class="remarks">${l.remarks}</div>` : ""}
        <div id="tw"></div>
      </div>
    </div>`;
  $("#blindchk").onchange = e => { blind = e.target.checked; localStorage.setItem("ff_blind", blind ? "1" : "0"); loadTriage(); };
  $("#tw").appendChild(labelWidget(l, () => loadTriage()));
}
document.addEventListener("keydown", e => {
  if (!$("#triage").classList.contains("on") || !triageCur) return;
  if (["1", "2", "3"].includes(e.key)) {
    const b = $(`#tw .verdicts button[data-v="${+e.key - 1}"]`);
    if (b) b.click();
  }
});

// ---- metrics ----
async function loadMetrics() {
  const m = await (await fetch("/api/metrics")).json();
  const dis = m.disagreements;
  const ai = m.ai_agreement;
  const rate = v => v == null ? "—" : Math.round(v * 100) + "%";
  const row = r => `<tr><td>${r.address}</td><td>${fmt$(r.price)}</td><td>${r.score}</td></tr>`;
  $("#metrics").innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="big">${m.labels.total}</div><div class="lbl">labels (${m.labels.pass}P / ${m.labels.maybe}M / ${m.labels.deal}D)</div></div>
      <div class="tile"><div class="big">${m.holdout_spearman ?? "—"}</div><div class="lbl">holdout spearman</div></div>
      <div class="tile"><div class="big">${m.holdout_p20 ?? "—"}</div><div class="lbl">holdout precision@20</div></div>
      <div class="tile"><div class="big">v${m.scorer_version}</div><div class="lbl">scorer version</div></div>
      <div class="tile"><div class="big">${m.scored_listings}</div><div class="lbl">scored listings</div></div>
    </div>
    <div class="box">
      <h3>Current weights</h3>
      <table><tr>${Object.keys(m.weights).map(k => `<th>${k}</th>`).join("")}</tr>
             <tr>${Object.values(m.weights).map(v => `<td>${v}</td>`).join("")}</tr></table>
      <div style="margin-top:12px"><button id="fitbtn">Refit weights from labels</button></div>
      <div id="fitout"></div>
    </div>
    <div class="box"><h3>AI suggestions vs your labels</h3>
      <table>
        <tr><th>labels with AI suggestion</th><th>verdict agreement</th><th>shown</th><th>blind</th><th>condition corrections</th><th>mean |AI − you|</th></tr>
        <tr><td>${ai.n}</td><td>${rate(ai.verdict_agreement)}</td><td>${rate(ai.shown.verdict_agreement)} (n=${ai.shown.n})</td>
            <td>${rate(ai.blind.verdict_agreement)} (n=${ai.blind.n})</td><td>${ai.condition_corrections}</td><td>${ai.condition_mae ?? "—"}</td></tr>
      </table>
      <table style="margin-top:10px;max-width:360px">
        <tr><th>AI ↓ / you →</th>${V_NAMES.map(n => `<th>${n}</th>`).join("")}</tr>
        ${ai.confusion.map((r, i) => `<tr><th>${V_NAMES[i]}</th>${r.map(v => `<td>${v}</td>`).join("")}</tr>`).join("")}
      </table>
    </div>
    <div class="box"><h3>Algo likes it, you passed</h3>
      <table><tr><th>Address</th><th>Price</th><th>Score</th></tr>${dis.algo_likes_you_pass.map(row).join("") || "<tr><td colspan=3>none</td></tr>"}</table></div>
    <div class="box"><h3>You like it, algo is cold</h3>
      <table><tr><th>Address</th><th>Price</th><th>Score</th></tr>${dis.you_like_algo_cold.map(row).join("") || "<tr><td colspan=3>none</td></tr>"}</table></div>
    <div class="box"><h3>Recent scorer versions</h3>
      <table><tr><th>v</th><th>train n</th><th>holdout ρ</th><th>p@20</th><th>promoted</th><th>note</th></tr>
      ${m.recent_versions.map(v => `<tr><td>${v.version}</td><td>${v.train_n}</td><td>${v.holdout_spearman ?? "—"}</td><td>${v.holdout_p20 ?? "—"}</td><td>${v.promoted ? "yes" : "no"}</td><td>${v.note}</td></tr>`).join("") || "<tr><td colspan=6>none yet</td></tr>"}</table></div>`;
  $("#fitbtn").onclick = async () => {
    $("#fitbtn").disabled = true;
    const out = await (await fetch("/api/fit", { method: "POST" })).json();
    $("#fitout").textContent = JSON.stringify(out, null, 2);
    $("#fitbtn").disabled = false;
    if (out.promoted) loadMap();
  };
}

// ---- boot ----
map = L.map("map", { zoomControl: true }).setView([41.49, -81.69], 11);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap contributors", maxZoom: 19,
}).addTo(map);
loadMap();
</script>
</body>
</html>
